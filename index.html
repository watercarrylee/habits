}

[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

.bear-n{font-size:12.5px;font-weight:700;fill:var(--fg)}.bear-c{font-size:12.5px;fill:var(--fg);font-variant-numeric:tabular-nums}.bear-c tspan{font-size:10px;fill:var(--muted)}

.rk-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.rk-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.rk-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rk-v{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rk-val{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.rk-c{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.rk-c.up{color:var(--good)}
.rk-c.down{color:var(--bad)}
.rk-c.same{color:var(--faint);font-weight:400}
.rk-new{font-size:11px;font-weight:700;color:var(--muted);background:var(--chip);padding:1px 6px;border-radius:6px}

/* 投資獎勵 (一碰到就算): change of the recorded P&L from the last record before `from` to record k; % is of that day's market value */
function invChg(from,to,k){var ks=pnlKeys().filter(function(x){return x>=from&&x<=to;});if(!ks.length)return null;var b=prevPnlKey(from)||ks[0];
  var a=pnlAt(k)-pnlAt(b),c=cbAt(b)||cbAt(k),mv=c?c+unAt(b):0;return {amt:a,pct:mv>0?a/mv:null};}

}

function phTx(mode,fn){return phDb().then(function(d){return new Promise(function(res,rej){var tx=d.transaction('p',mode),st=tx.objectStore('p'),out=fn(st);
  tx.oncomplete=function(){res(out&&out.result!==undefined?out.result:out);};tx.onerror=tx.onabort=function(){rej(tx.error);};});});}
function phPut(id,blob){return phTx('readwrite',function(st){st.put(blob,id);});}
function phGet(id){return phTx('readonly',function(st){return st.get(id);});}
function phDel(id){if(PHURL[id]){try{URL.revokeObjectURL(PHURL[id]);}catch(e){}delete PHURL[id];}return phTx('readwrite',function(st){st.delete(id);});}
function phAll(){return phDb().then(function(d){return new Promise(function(res,rej){var out={},tx=d.transaction('p','readonly'),c=tx.objectStore('p').openCursor();
  c.onsuccess=function(){var cu=c.result;if(cu){out[cu.key]=cu.value;cu.continue();}};tx.oncomplete=function(){res(out);};tx.onerror=function(){rej(tx.error);};});});}
function phUrl(id){if(PHURL[id])return Promise.resolve(PHURL[id]);return phGet(id).then(function(b){if(!b)return '';PHURL[id]=URL.createObjectURL(b);return PHURL[id];});}
function phHydrate(){Array.prototype.forEach.call(document.querySelectorAll('img[data-ph]:not([src])'),function(im){phUrl(im.dataset.ph).then(function(u){if(u)im.src=u;else im.classList.add('phmiss');},function(){im.classList.add('phmiss');});});}
function phShrink(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,1600/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
    var go=function(q){cv.toBlob(function(b){if(!b){rej(new Error('encode'));return;}if(b.size>520000&&q>0.55)go(q-0.12);else res(b);},'image/jpeg',q);};go(0.8);};
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('decode'));};im.src=u;});}
function phSlot(k,slot){var l=db.logs[k]||{},id=l[slot];
  if(id)return '<button class="phthumb" data-act="phview" data-k="'+k+'" data-slot="'+slot+'" aria-label="看照片"><img data-ph="'+id+'" alt="照片"></button>';
  return '<button class="phadd" data-act="phadd" data-k="'+k+'" data-slot="'+slot+'">'+I.plus+'加照片</button>';}
function phPick(k,slot){var f=document.createElement('input');f.type='file';f.accept='image/*';f.style.display='none';document.body.appendChild(f);
  f.onchange=function(){var file=f.files&&f.files[0];f.remove();if(!file)return;toast('處理照片中⋯',4000);
    phShrink(file).then(function(b){var id=uid();return phPut(id,b).then(function(){var l=db.logs[k]||(db.logs[k]={}),old=l[slot];l[slot]=id;save();if(old)phDel(old);render();toast('已加入照片（'+Math.round(b.size/1024)+' KB）');});})
      .catch(function(){toast('這張照片無法讀取，請換一張試試',3000);});};
  f.click();}
function phSize(){return phAll().then(function(m){var n=0,b=0;for(var k in m){n++;b+=m[k]&&m[k].size||0;}return {n:n,b:b};});}
function phMB(b){return b<1048576?Math.max(1,Math.round(b/1024))+' KB':(Math.round(b/104857.6)/10)+' MB';}
function blobToData(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){res('');};r.readAsDataURL(b);});}
function dataToBlob(u){var m=/^data:(image\/(?:jpeg|png|webp));base64,([A-Za-z0-9+\/=]+)$/.exec(u||'');if(!m)return null;var bin=atob(m[2]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]});}
/* backups: photos ride along as data URLs under "photos" (only ids referenced by the logs), restored into IndexedDB */
function phRefs(d){var r={};Object.keys(d.logs||{}).forEach(function(k){var l=d.logs[k];if(l.np)r[l.np]=1;if(l.dp)r[l.dp]=1;});return r;}
function payloadText(cb){if(ui.bkNoPh||!window.indexedDB){cb(backupPayload());return;}var refs=phRefs(db);if(!Object.keys(refs).length){cb(backupPayload());return;}
  phAll().then(function(m){var ids=Object.keys(m).filter(function(id){return refs[id];});return Promise.all(ids.map(function(id){return blobToData(m[id]);})).then(function(us){
    var o=JSON.parse(backupPayload()),ph={};ids.forEach(function(id,i){if(us[i])ph[id]=us[i];});if(Object.keys(ph).length)o.photos=ph;cb(JSON.stringify(o));});}).catch(function(){cb(backupPayload());});}
function takePhotos(o){var p=o&&o.photos,out={};if(o)delete o.photos;if(p&&typeof p==='object')Object.keys(p).forEach(function(id){var c=cid(id);if(c&&typeof p[id]==='string')out[c]=p[id];});return out;}
function phRestore(ph){var ids=Object.keys(ph||{});return Promise.all(ids.map(function(id){var b=dataToBlob(ph[id]);return b?phPut(id,b):null;}));}
function noteBox(k,log){
  var n=log.note||'';
  /* 圖上字下: a photo sits above the text; without one, the add button stays below so the empty layout is unchanged */
  var hp=!!log.np,top=hp?'<div class="phrow top">'+phSlot(k,'np')+'</div>':'',bot=hp?'':'<div class="phrow">'+phSlot(k,'np')+'</div>';

  return '<div class="note-h"><label for="note" class="lbl">備註</label></div>'+top+'<textarea id="note" rows="3" placeholder="今天發生了什麼？">'+esc(n)+'</textarea>'+
    '<div class="note-foot" id="note-foot"'+(n.trim()?'':' hidden')+'><button class="minibtn" data-act="notedone">確認</button></div>'+bot;
}
function tidy(k){var l=db.logs[k];if(!l)return;if(l.h&&!Object.keys(l.h).length)delete l.h;if(!l.note)delete l.note;if(l.mood==null)delete l.mood;if(typeof l.pnl!=='number')delete l.pnl;if(!l.rest)delete l.rest;if(l.diary&&!l.diary.t&&!l.diary.q)delete l.diary;if(l.fa&&!l.fa.length)delete l.fa;if(!Object.keys(l).length)delete db.logs[k];}
function setVal(k,id,v){
  var l=db.logs[k]||(db.logs[k]={});l.h=l.h||{};
  if(v>0)l.h[id]=v;else delete l.h[id];
  tidy(k);save();
}
function sched(h,k){return h.kind!=='good'||!isWk(h)&&!!h.days[parseKey(k).getDay()];}
/* ---------- weekly habits: 每週 N 次，哪天都可以 (weeks start Monday) ---------- */
function isWk(h){return !!h&&h.kind==='good'&&h.freq==='week';}
function wkEnd(w){return addDays(w,6);}
function wkCount(h,w,upto){var c=0,e=wkEnd(w);if(upto&&upto<e)e=upto;for(var d=w;d<=e;d=addDays(d,1)){if(d>=h.created&&isDone(h,d))c++;}return c;}
function wkMet(h,w){return wkCount(h,w)>=(h.perWeek||3);}
/* the week a habit was created in only counts if it was met (第一週不算失敗) */
function wkExcused(h,w){return h.created>w&&!wkMet(h,w);}
function wkStreak(h,k){var w=weekStartKey(k),n=0,last=null;
  if(wkMet(h,w)){n++;last=w;}
  for(w=addDays(w,-7);wkEnd(w)>=h.created;w=addDays(w,-7)){if(wkMet(h,w)){n++;if(!last)last=w;}else break;}
  return {n:n,last:last};}
function wkBest(h,end){var best=0,run=0;for(var w=weekStartKey(h.created);w<=end;w=addDays(w,7)){var cur=w===weekStartKey(end);
  if(wkMet(h,w)){run++;if(run>best)best=run;}else if(!cur&&!wkExcused(h,w))run=0;}return best;}
function isRest(k){var l=db.logs[k];return !!(l&&l.rest);}
function scheduled(h,k){return sched(h,k)&&!(h.kind==='good'&&isRest(k)&&!isDone(h,k));}
function goodStreak(h,k){
  if(isWk(h))return wkStreak(h,k).n;
  var n=0,d=k;if(!isDone(h,d))d=addDays(d,-1);
  for(var i=0;i<4000&&d>=h.created;i++){if(scheduled(h,d)){if(isDone(h,d))n++;else break;}d=addDays(d,-1);}
  return n;
}
function bestStreak(h,end){
  if(isWk(h))return 0;
  var best=0,run=0,d=h.created;
  for(var i=0;i<4000&&d<=end;i++){if(scheduled(h,d)){if(isDone(h,d)){run++;if(run>best)best=run;}else run=0;}d=addDays(d,1);}
  return best;
}
function cleanDays(h,k){
  var d=addDays(k,-1);
  for(var i=0;i<4000&&d>=h.created;i++){if(val(d,h.id)>0)return diffDays(k,d);d=addDays(d,-1);}
  return Math.max(1,diffDays(k,h.created)+1);
}
function removeHabit(id){
  db.habits=db.habits.filter(function(h){return h.id!==id;});
  db.rewards=db.rewards.filter(function(r){return r.habit!==id;});
  Object.keys(db.logs).forEach(function(k){var l=db.logs[k];if(l.h)delete l.h[id];tidy(k);});
  save();
}
function addExamples(){
  var t=todayKey();
  [['運動 30 分鐘','good','check',allDays()],['閱讀 20 頁','good','check',allDays()],['喝水 2000ml','good','check',allDays()],

  ].forEach(function(x){db.habits.push({id:uid(),name:x[0],kind:x[1],method:x[2],days:x[3],created:t,archived:false,icon:guessIcon(x[0])});});
  save();

/* ---------- daily goal (count habits) ---------- */
var GOAL_ALL='2000-01-01';
function goalOn(h,k){if(!h||h.kind!=='good'||h.method!=='count')return 1;var n=1;(h.goalHist||[]).forEach(function(e){if(e.from<=k)n=e.n;});return n;}
function isDone(h,k){return val(k,h.id)>=goalOn(h,k);}
function isAmt(h){return !!h&&h.kind==='good'&&h.method==='count';}
function hUnit(h){return isAmt(h)?(h.unit||'次'):'次';}
function hStep(h){return isAmt(h)?(h.step||1):1;}
function amtTxt(h,v){return fmtN(v)+(hUnit(h)==='次'?' 次':' '+hUnit(h));}
/* "每按一次" changes. If the unit changes too (e.g. 次 → ml), old records were counting presses, so they are converted
   (one old press = one new press). If the unit stays (500 ml → 250 ml a tap), old amounts are real amounts and stay as they are;
   stepHist remembers the old tap size so savings per tap on past days do not change. */
function stepOn(h,k){var s=hStep(h);(h.stepHist||[]).forEach(function(e){if(e.from<=k)s=e.step;});if(h.stepHist&&h.stepHist.length&&k<h.stepHist[0].from)s=h.stepHist[0].step;return s;}
function convStep(u0,u1){return (u0||'次')!==(u1||'次');}
function changeStep(h,s1,u1){var s0=h.step||1;if(s0===s1)return;
  if(convStep(h.unit,u1)){rescaleStep(h,s0,s1);delete h.stepHist;return;}
  var t=todayKey(),sh=h.stepHist=h.stepHist||[];if(!sh.length)sh.push({from:GOAL_ALL,step:s0});
  var last=sh[sh.length-1];if(last.from===t)last.step=s1;else sh.push({from:t,step:s1});}
function rescaleStep(h,s0,s1){if(s0===s1||!s0||!s1)return;var r=s1/s0;
  Object.keys(db.logs).forEach(function(k){var l=db.logs[k];if(l.h&&l.h[h.id])l.h[h.id]=Math.max(1,Math.min(999999,Math.round(l.h[h.id]*r)));});
  (h.goalHist||[]).forEach(function(e){e.n=Math.max(1,Math.min(999999,Math.round(e.n*r)));});}
function setGoal(h,n,isNew){n=clampInt(n,1,999999,1);
  if(isNew){h.goalHist=n>1?[{from:GOAL_ALL,n:n}]:[];return;}
  var t=todayKey();if(goalOn(h,t)===n)return;h.goalHist=h.goalHist||[];var last=h.goalHist[h.goalHist.length-1];
  if(last&&last.from===t)last.n=n;else h.goalHist.push({from:t,n:n});}

/* ---------- savings ---------- */
function amtOn(h,k){var a=0;(h.saveHist||[]).forEach(function(e){if(e.from<=k)a=e.amt;});return a;}
function setSave(h,amt,from){
  var t=todayKey();amt=Math.max(0,Math.round(+amt)||0);
  var first=!(h.saveHist||[]).some(function(e){return e.amt>0&&e.from<t;});
  if(first&&amt>0&&isKey(from)&&from<t){h.saveHist=[{from:from,amt:amt}];return;}
  if(amtOn(h,t)===amt)return;
  h.saveHist=h.saveHist||[];var last=h.saveHist[h.saveHist.length-1];
  if(last&&last.from===t)last.amt=amt;else h.saveHist.push({from:t,amt:amt});
}
function savedFor(h,k){
  var a=amtOn(h,k);if(!a)return 0;var v=val(k,h.id);
  if(h.kind==='good')return h.method==='count'?Math.floor(v/stepOn(h,k))*a:(v>0?a:0);
  return (db.logs[k]&&!(v>0))?a:0;
}
function savingsTotals(){
  var t=todayKey(),ms=t.slice(0,8)+'01',all=0,mon=0,per={},from=null;
  db.habits.forEach(function(h){(h.saveHist||[]).forEach(function(e){if(e.amt>0&&(!from||e.from<from))from=e.from;});});
  Object.keys(db.logs).forEach(function(k){
    if(k>t)return;
    db.habits.forEach(function(h){
      var v=savedFor(h,k);if(!v)return;all+=v;
      if(k>=ms){mon+=v;var p=per[h.id]||(per[h.id]={h:h,n:0,amt:0});p.n+=Math.max(1,Math.round(v/amtOn(h,k)));p.amt+=v;}
    });
  });
  var spent=db.redeemed.reduce(function(a,x){return a+(x.amount||0);},0);
  return {all:all,mon:mon,per:per,spent:spent,avail:all-spent,from:from};
}
function anySave(){return db.habits.some(function(h){return (h.saveHist||[]).some(function(e){return e.amt>0;});});}

/* ---------- rest cards ---------- */
var REST_PER_MONTH=2;
function restUsed(k){var ms=k.slice(0,8)+'01',me=monthEndKey(k);return Object.keys(db.logs).filter(function(x){return x>=ms&&x<=me&&db.logs[x].rest;}).length;}
function restUI(k){
  var t=todayKey();if(k>=t||diffDays(t,k)>7)return '';
  var mo=(parseKey(k).getMonth()+1)+'月';
  if(isRest(k))return '<div class="restbar on"><span>這天用了休息卡，沒做到的好習慣不會中斷連續，也不算進完成率。</span><button class="ghost" data-act="unrest">取消休息</button></div>';
  var missed=active('good').filter(function(h){return sched(h,k)&&k>=h.created&&!isDone(h,k);});
  if(!missed.length)return '';
  var left=REST_PER_MONTH-restUsed(k);
  return '<div class="restbar"><span>這天沒做到 '+missed.length+' 項。生病或有事的話，可以用休息卡補這一天。</span>'+
    '<button class="darkbtn" data-act="userest"'+(left>0?'':' disabled')+'>'+(left>0?'用休息卡（'+mo+'剩 '+left+' 張）':mo+'的休息卡用完了')+'</button></div>';
}

/* ---------- rewards ---------- */
function monthEndKey(k){var d=parseKey(k);return keyOf(new Date(d.getFullYear(),d.getMonth()+1,0));}
function nextMonthKey(k){var d=parseKey(k);return keyOf(new Date(d.getFullYear(),d.getMonth()+1,1));}
function weekStartKey(k){var d=parseKey(k);return addDays(k,-((d.getDay()+6)%7));}
/* weeks whose Sunday falls in [from,to]; a week still running counts only once met */
function wkMonth(h,from,to){var t=todayKey(),sc=0,dn=0,cnt=0;
  for(var w=weekStartKey(from);w<=to;w=addDays(w,7)){var e=wkEnd(w);if(e<from||e>to)continue;
    var met=wkMet(h,w);if(e>=t&&!met)continue;if(wkExcused(h,w))continue;sc++;if(met)dn++;}
  for(var d=from;d<=to&&d<=t;d=addDays(d,1))if(d>=h.created&&isDone(h,d))cnt++;
  return {sc:sc,dn:dn,cnt:cnt};}
function maxK(){var a=[].slice.call(arguments).filter(Boolean).sort();return a[a.length-1];}
function rById(id){for(var i=0;i<db.rewards.length;i++)if(db.rewards[i].id===id)return db.rewards[i];return null;}
function streakSince(h,end,since){
  if(isWk(h)){var w=weekStartKey(end),n=0,last=null;if(wkMet(h,w)&&(!since||w>since)){n++;last=w;}
    for(w=addDays(w,-7);wkEnd(w)>=h.created&&(!since||w>since);w=addDays(w,-7)){if(wkMet(h,w)){n++;if(!last)last=w;}else break;}
    return {n:n,last:last};}
  var n=0,last=null,d=end;if(!isDone(h,d))d=addDays(d,-1);
  for(var i=0;i<4000&&d>=h.created&&(!since||d>since);i++){
    if(scheduled(h,d)){if(isDone(h,d)){n++;if(!last)last=d;}else break;}
    d=addDays(d,-1);
  }
  return {n:n,last:last};
}
function weekCount(h,w,from,t){var c=0;for(var i=0;i<7;i++){var d=addDays(w,i);if(d>=from&&d>=h.created&&d<=t&&isDone(h,d))c++;}return c;}
function monthResult(r,h,m,to){
  if(isWk(h)&&r.type==='rate'){var wr=wkMonth(h,maxK(m,r.created),to);return {rate:wr.sc?Math.round(wr.dn/wr.sc*100):0,sc:wr.sc};}
  var from=maxK(m,r.created,h.created),sc=0,dn=0,slips=0;
  for(var d=from;d<=to;d=addDays(d,1)){
    if(r.type==='rate'){if(scheduled(h,d)){sc++;if(isDone(h,d))dn++;}}
    else slips+=val(d,h.id);
  }
  return r.type==='rate'?{rate:sc?Math.round(dn/sc*100):0,sc:sc}:{slips:slips};
}
function syncRewards(){
  var t=todayKey(),changed=false;
  db.rewards.forEach(function(r){
    if(r.done||r.type==='saved')return;
    if(isInv(r.type)){if(db.settings.pnl&&invSync(r,t))changed=true;return;}
    var h=byId(r.habit);if(!h||h.archived)return;
    if(!r.repeat&&r.earned.length)return;
    if(r.type==='streak'){
      var st=streakSince(h,t,r.earned.length?r.earned[r.earned.length-1]:null);
      if(st.n>=r.target&&st.last){r.earned.push(st.last);changed=true;}
    }else if(r.type==='total'||r.type==='clean'||r.type==='wktotal'){
      rReplay(r,h,t).hits.forEach(function(k){if(r.earned.indexOf(k)<0){r.earned.push(k);changed=true;}});
    }else if(r.type==='weekly'){
      for(var w=weekStartKey(r.created);w<=t;w=addDays(w,7)){
        if(r.earned.indexOf(w)>=0)continue;
        if(weekCount(h,w,r.created,t)>=r.target){r.earned.push(w);changed=true;if(!r.repeat)break;}
      }
    }else{
      for(var m=r.created.slice(0,8)+'01';monthEndKey(m)<t;m=nextMonthKey(m)){
        if(r.earned.indexOf(m)>=0)continue;
        var res=monthResult(r,h,m,monthEndKey(m));
        var ok=r.type==='rate'?(res.sc>0&&res.rate>=r.target):res.slips<=r.target;
        if(ok){r.earned.push(m);changed=true;if(!r.repeat)break;}
      }
    }
  });
  if(changed)save();
}
function redCount(rid){return db.redeemed.filter(function(x){return x.rid===rid;}).length;}
function pending(r,tot){
  if(r.done)return 0;
  if(r.type==='saved')return r.target>0&&tot.avail>=r.target?1:0;
  if(isInv(r.type))return Math.max(0,r.earned.length-redCount(r.id));
  var h=byId(r.habit);if(!h||h.archived)return 0;
  return Math.max(0,r.earned.length-redCount(r.id));
}
function pctOf(a,b){return b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):0;}
function ruleText(r,h,ml){
  if(isInv(r.type)){var hd=hid(),am=function(v){return hd?'NT$••••':'NT$'+fmtN(v);};
    return r.type==='invhi'?'未實現損益突破 '+am(r.target):r.type==='invpct'?'報酬率達到 '+r.target+'%':(r.type==='invwk'?'一週內':(ml||'一個月內'))+'未實現損益增加 '+(rPctMode(r)?r.target+'%':am(r.target));}
  var hn=h?'「'+esc(h.name)+'」':'「（已刪除的習慣）」',t=r.target,mm=ml||'這個月';
  return {streak:hn+'連續做到 '+t+(isWk(h)?' 週':' 天'),weekly:'一週內'+hn+'做到 '+t+' 天',rate:mm+hn+'完成率達到 '+t+'%',

function progressOf(r,h,tot){
  var t=todayKey(),me=monthEndKey(t),settle=shortMD(me)+' 結算';
  if(r.type==='saved')return {txt:'NT$'+fmtN(Math.max(0,tot.avail))+' / '+fmtN(r.target),pct:pctOf(tot.avail,r.target)};
  if(isInv(r.type)){var hd=hid(),ks=pnlKeys().filter(function(k){return k>=r.created;}),lk=ks[ks.length-1];
    if(!db.settings.pnl)return {txt:'暫停中',pct:0,cls:'paused',note:'「記錄未實現損益」關閉中'};
    if(!lk)return {txt:'還沒有紀錄',pct:0,note:'從 '+shortMD(r.created)+' 起的紀錄才會算'};
    /* current value in stock colors (漲紅跌綠), target in grey */
    var tg=function(x){return '<span class="gtgt"> / '+x+'</span>';},cv=function(v,txt){return '<b class="'+(hd?'':pcls(v))+'">'+txt+'</b>';};
    if(r.type==='invhi'){var v=pnlAt(lk);return {txt:'目前 '+cv(v,hd?'••••':sgn(v))+tg(hd?'••••':fmtN(r.target)),pct:pctOf(v,r.target),cls:'inv'};}
    if(r.type==='invpct'){var f=pnlPct(lk);return {txt:f==null?'—':'目前 '+cv(f,hd?'••%':pctS(f))+tg(r.target+'%'),pct:f==null?0:pctOf(f*100,r.target),cls:'inv'};}
    var wk=r.type==='invwk',per=wk?weekStartKey(t):t.slice(0,8)+'01',lbl=wk?'本週':'本月';
    if(r.earned.indexOf(per)>=0)return {txt:lbl+'已達成',pct:100,note:r.repeat?RTYPES[r.type].again:''};
    var inP=ks.filter(function(k){return k>=per;}),c=inP.length?invChg(per,wk?wkEnd(per):monthEndKey(per),inP[inP.length-1]):null;
    if(!c)return {txt:lbl+'還沒有紀錄',pct:0};
    var pm=rPctMode(r),cur=pm?(c.pct==null?0:c.pct*100):c.amt;
    var arr=function(v){return v>0?'▲':v<0?'▼':'';},cvv=pm?(c.pct||0):c.amt,ctx=pm?arr(cvv)+Math.abs(cvv*100).toFixed(2)+'%':arr(cvv)+fmtN(cvv);
    return {txt:lbl+' '+cv(cvv,hd?(pm?'••%':'••••'):ctx)+tg(pm?r.target+'%':hd?'••••':fmtN(r.target)),pct:pctOf(cur,r.target),note:'碰到就算，之後跌回去也不會收回',cls:'inv'};}
  if(!h)return {txt:'',pct:0};
  if(h.archived)return {txt:'暫停中',pct:0,cls:'paused',note:'習慣已封存，恢復後會繼續計算。'};
  if(r.type==='streak'){var n=streakSince(h,t,r.earned.length?r.earned[r.earned.length-1]:null).n;return {txt:n+' / '+r.target+(isWk(h)?' 週':' 天'),pct:pctOf(n,r.target)};}
  if(r.type==='total'||r.type==='clean'||r.type==='wktotal'){var rp=rReplay(r,h,t),n=!r.repeat&&rp.hits.length?r.target:rp.n,u=r.type==='wktotal'?' 週':' 天';
    return r.type==='clean'?{txt:'已連續 '+n+' 天沒犯 / '+r.target+' 天',pct:pctOf(n,r.target),note:'從昨天往回算，今天過完才算進去'}:{txt:n+' / '+r.target+u,pct:pctOf(n,r.target)};}
  if(r.type==='weekly'&&r.earned.indexOf(weekStartKey(t))>=0)return {txt:'本週已達成',pct:100,note:r.repeat?'下週重來':''};
  if(r.type==='weekly'){var c=weekCount(h,weekStartKey(t),r.created,t);return {txt:'本週 '+c+' / '+r.target+' 天',pct:pctOf(c,r.target)};}

  if(r.type==='rate')return {txt:'目前 '+res.rate+'%',pct:pctOf(res.rate,r.target),note:settle};
  var over=res.slips>r.target;
  return {txt:over?'已超過 '+(res.slips-r.target)+' 次':'剩 '+(r.target-res.slips)+' 次額度',pct:r.target?pctOf(res.slips,r.target):(res.slips?100:0),cls:over?'over':'',
    note:'目前犯了 '+res.slips+' 次 · '+(over?(r.repeat?'這個月沒達成，下個月重來':'這次沒達成'):settle)};
}

function holdParse(text){var rows=[],seen={};

    if(!m){if(/代號|股數|成本|code/i.test(t))return;rows.push({line:ln+1,raw:raw,err:'看不懂這一行'});return;}
    var head=m[1].trim(),rest=m[2],sp=function(x){return x.split(/[\s,，\t|;]+/).filter(Boolean);},a=sp(rest);

function snip(text,terms){
  if(text.length<=140)return text;
  var i=terms.length?text.toLowerCase().indexOf(terms[0]):0;if(i<0)i=0;
  var st=Math.max(0,i-40);
  return (st>0?'…':'')+text.slice(st,st+140)+(st+140<text.length?'…':'');
}
function highlight(text,terms){
  if(!terms.length)return esc(text);
  var low=text.toLowerCase(),out='',i=0;
  while(i<text.length){
    var best=-1,len=0;
    terms.forEach(function(t){var j=low.indexOf(t,i);if(j>=0&&(best<0||j<best||(j===best&&t.length>len))){best=j;len=t.length;}});
    if(best<0){out+=esc(text.slice(i));break;}
    out+=esc(text.slice(i,best))+'<mark>'+esc(text.slice(best,best+len))+'</mark>';i=best+len;
  }
  return out;
}

function rankMonth(y,m){

  if(ms>t)return {good:[],bad:[],ms:ms,me:me};

    if(isWk(h)){var wm=wkMonth(h,from,me);var tot2=0,nd2=0;if(isAmt(h))for(var d4=from;d4<=to;d4=addDays(d4,1)){tot2+=val(d4,h.id);nd2++;}

      var tot=0,nd=0;if(isAmt(h))for(var d3=from;d3<=to;d3=addDays(d3,1)){tot+=val(d3,h.id);nd++;}

    }

  good.sort(function(a,b){return (b.ok-a.ok)||(b.rate-a.rate)||(b.st-a.st)||(a.h.name<b.h.name?-1:1);});

/* every card with a target: name / "75% · 連續 5 天" (or ✓ 達成) / progress bar */
function cardProg(h,k){
  if(isWk(h)){var w=weekStartKey(k),t=todayKey(),N=h.perWeek||3,c=wkCount(h,w,wkEnd(w)<t?wkEnd(w):t),warn='';
    if(c<N&&w===weekStartKey(t)){var left=diffDays(wkEnd(w),t)+(isDone(h,t)?0:1),need=N-c;if(need>=left)warn=need>left?'這週差 '+need+' 次':'還差 '+need+' 次 · 剩 '+left+' 天';}
    return {cur:c,goal:N,seg:N,unit:'週',warn:warn};}
  var gl=goalOn(h,k);
  if(h.method==='count'&&(gl>1||hUnit(h)!=='次'))return {cur:val(k,h.id),goal:gl,unit:'天'};
  if(h.method==='check'&&h.fitLink&&fOn()){var tg=fitTarget(h);if(tg){var on=isDone(h,k);return {cur:on?tg:Math.min(fitMinutes(k).tot,tg-1),goal:tg,unit:'天'};}}

function progLine(pg,st){var done=pg.cur>=pg.goal,pct=Math.round(pg.cur/pg.goal*100);if(!done&&pct>99)pct=99;

  return a+(st>0?' · 連續 '+st+' '+pg.unit:'');}
function progBar(pg){
  if(pg.seg){var x='';for(var i=0;i<pg.seg;i++)x+='<i'+(i<pg.cur?' class="on"':'')+'></i>';return '<div class="pbar seg" aria-hidden="true">'+x+'</div>';}
  return '<div class="pbar" aria-hidden="true"><i style="width:'+Math.min(100,Math.round(pg.cur/pg.goal*100))+'%"></i></div>';}
function goodCard(h,k){
  var v=val(k,h.id),on=isDone(h,k),st=goodStreak(h,k),pg=cardProg(h,k),sub,bar='';

function badCard(h,k){

/* ---------- backup encryption (PBKDF2-SHA256 + AES-GCM) ---------- */
var MAX_BACKUP=300e6,KDF_ITER=600000;
function canCrypt(){try{return !!(window.crypto&&crypto.subtle&&window.TextEncoder);}catch(e){return false;}}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(str){var s=atob(str),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function deriveKey(pw,salt,iter){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});
}
function encryptText(text,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return deriveKey(pw,salt,KDF_ITER).then(function(key){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text));})
    .then(function(ct){return JSON.stringify({habitsBackup:1,enc:'AES-GCM',kdf:'PBKDF2-SHA256',iter:KDF_ITER,salt:b64(salt),iv:b64(iv),data:b64(ct)});});
}
function decryptText(o,pw){
  var iter=Math.min(Math.max(+o.iter||KDF_ITER,100000),5000000);
  return deriveKey(pw,unb64(o.salt),iter).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.data));})
    .then(function(pt){return new TextDecoder().decode(pt);});
}
function isEncBackup(o){return o&&o.habitsBackup===1&&o.enc==='AES-GCM'&&typeof o.salt==='string'&&typeof o.iv==='string'&&typeof o.data==='string';}
function startExport(){
  if(!canCrypt()){payloadText(function(pt){doExport(pt,false);});return;}
  ui.sheet={type:'exportpw',err:''};render();var f=$('#pw1');if(f)f.focus();
  if(window.indexedDB&&Object.keys(phRefs(db)).length)phSize().then(function(z){if(ui.sheet&&ui.sheet.type==='exportpw'){ui.sheet.ph=z;var a=$('#pw1')&&$('#pw1').value,b2=$('#pw2')&&$('#pw2').value;render();if($('#pw1'))$('#pw1').value=a||'';if($('#pw2'))$('#pw2').value=b2||'';}});
}

}
/* backup file naming: time + source, so backups from different browsers or times never share a name */
var SRC_LABEL={app:'主畫面 App',safari:'Safari',chrome:'Chrome',edge:'Edge',firefox:'Firefox',demo:'示範',browser:'瀏覽器',auto:'自動備份'};
function backupSource(){if(DEMO)return 'demo';if(isStandalone())return 'app';var u=navigator.userAgent||'';
  if(/EdgiOS|Edg\//.test(u))return 'edge';if(/FxiOS|Firefox\//.test(u))return 'firefox';if(/CriOS|Chrome\//.test(u))return 'chrome';if(/Safari\//.test(u))return 'safari';return 'browser';}

function backupPayload(){var o={};for(var k in db)o[k]=db[k];o.meta={exportedAt:new Date().toISOString(),source:backupSource(),app:APP_VER};return JSON.stringify(o);}
function takeMeta(o){if(!o||typeof o!=='object')return null;var m=o.meta;delete o.meta;if(!m||typeof m!=='object')return null;
  var at=new Date(String(m.exportedAt||''));return {at:isNaN(at)?null:at,src:String(m.source||'').slice(0,12)};}

function tryImport(text){

function updCheck(){var now=Date.now();if(now-updLast<60000)return;updLast=now;
  fetch('version.json?t='+now,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j||typeof j.v!=='string'||verNum(j.v)<=verNum(APP_VER)||j.notify===false)return;
    updPending=j;updMaybe();}).catch(function(){});}
/* never interrupt an unsaved edit: wait until the user is back on a normal screen */
function updMaybe(){if(updPending&&EDITING_VIEWS.indexOf(ui.view)<0&&!ui.sheet)updShow(updPending);}
function updShow(j){var el=$('#updcard');if(!el){el=document.createElement('div');el.id='updcard';el.setAttribute('role','status');document.body.appendChild(el);}
  var notes=(Array.isArray(j.notes)?j.notes:[]).slice(0,3).filter(function(x){return typeof x==='string';});
  el.innerHTML='<div class="upd-t">有新版本 '+esc(j.v)+'</div>'+(notes.length?'<ul>'+notes.map(function(x){return '<li>'+esc(x.slice(0,80))+'</li>';}).join('')+'</ul>':'')+
    '<p class="upd-s">紀錄都已經存好，更新只要幾秒。</p><div class="upd-b"><button class="primary" data-upd="go">立即更新</button></div>';
  el.dataset.v=j.v;el.hidden=false;}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-upd]');if(b)location.reload();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')updCheck();});
setTimeout(updCheck,1500);
render();
if(autoIcons)toast('已幫 '+autoIcons+' 個習慣加上圖示，可在「設定」修改',4000);
})();
</script>

</body>
</html>
