<!doctype html>
<html lang="zh-Hant" class="own-host">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-HlBXDOV0hOENvNiL6PIEu8Csdo/5brLbueEkL+VuEMo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="習慣">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<title>習慣紀錄</title>
<style>
/* Layout: one-screen phone app — a scrolling content column above a three-tab bar; data lives in this browser only */
:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --chip:#ECE7DE; --line:#E2DBCF; --line-soft:#EFEAE1;
  --fg:#1C1B19; --muted:#6B655C; --faint:#9A9388;
  --good:#2F6B52; --good-soft:#E3EFE8; --good-line:#9CC4B0; --on-good:#FFFFFF;
  --bad:#B4471C; --bad-soft:#F8E9E1; --bad-line:#E9BFA9; --on-bad:#FFFFFF;
  --ink:#1C1B19; --on-ink:#FFFFFF;
  --h1:#C6DFD1; --h2:#7FB297;
  --up:#C8283A; --down:#1F7A4A;
  --scrim:rgba(28,27,25,.45);
  --shadow:0 1px 3px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --surface:#22201D; --chip:#2D2A26; --line:#3A3631; --line-soft:#2D2A26;
    --fg:#F1EDE6; --muted:#ABA498; --faint:#7D776D;
    --good:#62B48C; --good-soft:#1C3127; --good-line:#3B6B53; --on-good:#0E1D15;
    --bad:#E8845A; --bad-soft:#3A2219; --bad-line:#6E3A24; --on-bad:#1F0E06;
    --ink:#F1EDE6; --on-ink:#171614;
    --h1:#25402F; --h2:#3D7759;
    --up:#FF6B76; --down:#4CC38A;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 3px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --surface:#22201D; --chip:#2D2A26; --line:#3A3631; --line-soft:#2D2A26;
  --fg:#F1EDE6; --muted:#ABA498; --faint:#7D776D;
  --good:#62B48C; --good-soft:#1C3127; --good-line:#3B6B53; --on-good:#0E1D15;
  --bad:#E8845A; --bad-soft:#3A2219; --bad-line:#6E3A24; --on-bad:#1F0E06;
  --ink:#F1EDE6; --on-ink:#171614;
  --h1:#25402F; --h2:#3D7759;
  --up:#FF6B76; --down:#4CC38A;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 3px rgba(0,0,0,.5);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--good);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding-inline:20px;padding-block:20px 32px;display:flex;flex-direction:column;gap:22px}
.own-host .page{padding-top:calc(16px + env(safe-area-inset-top,0px))}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-inline:16px;padding-block:4px}
.own-host .tabs{padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:0;background:none;color:var(--muted);font-size:11px}
.tab.on{color:var(--good);font-weight:700}

.h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.sub{font-size:13px;color:var(--muted);letter-spacing:.06em}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar-mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.iconbtn{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:22px;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.linkbtn{align-self:center;border:0;background:none;color:var(--good);font-weight:700;font-size:14px;min-height:36px;margin-top:-14px}

.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum-card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.sum-card.good{background:var(--good);border-color:var(--good);color:var(--on-good)}
.sum-l{font-size:12px;opacity:.85}
.sum-v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.sum-v small{font-size:15px;font-weight:500;opacity:.8}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-t{margin:0;font-size:15px;font-weight:700}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:1.6;margin:0}

.hcard{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;min-height:68px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);text-align:left;color:var(--fg)}
button.hcard{padding-right:16px}
.hcard.g-on{background:var(--good-soft);border-color:var(--good-line)}
.hcard.b-on{background:var(--bad-soft);border-color:var(--bad-line)}
.hc-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.hc-name{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.hc-sub{font-size:12px;color:var(--muted)}
.check{flex:0 0 auto;width:32px;height:32px;border-radius:16px;box-sizing:border-box;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center}
.check.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.check.bad.on{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.counter{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.minus{width:36px;height:36px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.minus:disabled{opacity:.4;cursor:default}
.plus{width:44px;height:44px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;padding:0}
.plus.good{background:var(--good);color:var(--on-good)}
.plus.bad{background:var(--bad);color:var(--on-bad)}
.cnt{min-width:28px;text-align:center;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.cnt.zero{color:var(--faint)}
.lockbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;color:var(--muted)}
.lockbar>span{display:flex;align-items:center;gap:6px;min-width:0}.lockbar svg{flex:0 0 auto}
.lockbar .ghost{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lockbar.open{border-color:var(--good);color:var(--good)}
.page.locked .hcard,.page.locked .moods,.page.locked .restbar{opacity:.55}
.row-btn.lockn{flex-direction:column;align-items:stretch;gap:10px}.lockn .useg{display:grid;grid-template-columns:repeat(4,1fr)}.lockn .useg button{white-space:nowrap}
.cnt.big{font-size:16px;min-width:44px}
.cntbtn{border:0;background:transparent;padding:4px 2px;border-radius:8px;font-family:inherit;line-height:1.2;text-decoration:underline dotted;text-decoration-color:var(--line);text-underline-offset:4px}
.unitchips{align-items:center}.unitchips input.unitin{flex:0 0 auto;width:84px;height:36px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);padding:0 12px;font-size:16px;text-align:center}.unitchips input.unitin.on{border-color:var(--fg)}
.pwrow.amtrow{display:flex;flex-direction:row;align-items:center;gap:10px}.pwrow.amtrow input{flex:1 1 auto;width:auto;min-width:0;font-size:24px;font-weight:900;text-align:center}.pwrow.amtrow span{flex:0 0 auto;font-size:16px;color:var(--muted)}
.rk-amt{display:block;margin-top:2px}
.gbar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;max-width:140px;overflow:hidden}.gbar i{display:block;height:100%;background:var(--good);border-radius:2px;transition:width .25s}
.goalv{font-size:24px;font-weight:900;color:var(--fg);font-variant-numeric:tabular-nums}

.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;padding:0}
.mood.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:700}
.lbl{font-size:13px;color:var(--muted)}
input[type=search]{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:100%;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:0 14px;height:48px;font-size:16px}
textarea,input[type=text]{box-sizing:border-box;width:100%;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 14px;font-size:16px}
textarea{resize:none;line-height:1.5}
.note-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.note-view{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.note-foot{display:flex;justify-content:flex-end}
input[type=text]{height:52px;font-size:17px}

.empty{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty-t{font-size:18px;font-weight:700}
.empty p{margin:0;color:var(--muted);line-height:1.6}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.primary{min-height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--good);color:var(--on-good);font-weight:700}
.primary.danger{background:var(--bad);color:var(--on-bad)}
.secondary{min-height:48px;padding:0 20px;border-radius:24px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}

.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:2px}
.monthnav .iconbtn{background:none}
.month-l{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{text-align:center;font-size:11px;color:var(--muted)}
.cell{position:relative;aspect-ratio:1;max-width:100%;box-sizing:border-box;border-radius:10px;border:0;padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;background:var(--chip);color:var(--fg)}
.cell.blank{background:none}
.cell.future{background:none;color:var(--faint)}
.cell.l1{background:var(--h1)}
.cell.l2{background:var(--h2)}
.cell.l3{background:var(--good);color:var(--on-good)}
.cell.today{box-shadow:0 0 0 2px var(--fg);font-weight:900}
.dot{position:absolute;bottom:4px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:3px;background:var(--bad);box-shadow:0 0 0 1.5px var(--surface)}
.legend{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-l{font-size:11px;color:var(--muted)}
.tile-v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.barcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar-name{font-size:14px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.bar-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.track{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.fill{height:100%;border-radius:4px}

.addbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;padding:0}
.list{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.row:last-child{border-bottom:0}
.row.dragging{background:var(--chip)}
.handle{flex:0 0 auto;width:44px;display:flex;align-items:center;justify-content:center;color:var(--faint);touch-action:none;cursor:grab}
.row-main{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding:12px 14px 12px 0;min-height:60px;border:0;background:none;text-align:left;color:var(--fg)}
.row-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.row-meta{font-size:12px;color:var(--muted)}
.chev{color:var(--faint);flex:0 0 auto}
.row-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;min-height:52px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;font-size:16px;color:var(--fg)}
.list .row-btn:last-child{border-bottom:0}
.row-btn .row-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-sub{font-size:12px;color:var(--muted);line-height:1.5}
div.row-btn{box-sizing:border-box;cursor:default}
.row-btn.subrow{padding-left:32px;font-size:15px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.dcard{width:100%;box-sizing:border-box;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--fg);font-size:15px}
.dcard.blankd{border-style:dashed;border-color:var(--faint);flex-direction:row;align-items:center;gap:12px}
.dprev{font-size:15px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.dprev.three{-webkit-line-clamp:3}
.dlocked{display:flex;align-items:center;gap:6px;color:var(--muted)}
.dmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dmeta b{color:var(--fg);font-size:14px;display:flex;align-items:center;gap:2px}
.dpen{flex:0 0 auto;width:40px;height:40px;border-radius:20px;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center}
.dtl{display:flex;flex-direction:column;gap:2px}
.dtl b{font-size:16px}.dtl span{font-size:12px;color:var(--muted)}
.dw{display:flex;flex-direction:column;min-height:100%}
.dw-body{flex:1 1 auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:14px;max-width:620px;width:100%;margin:0 auto;box-sizing:border-box}
.a2{background:var(--surface);border:1.5px solid var(--good-line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.a2-t{font-size:16px;font-weight:700}
.a2 ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.a2 ol svg{vertical-align:-3px}
.a2-f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.a2never{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:44px}
.a2never input{width:20px;height:20px;accent-color:var(--good);margin:0}
.tabs.five{grid-template-columns:repeat(5,minmax(0,1fr));padding-inline:6px}
.fcard{width:100%;box-sizing:border-box;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--fg);font-size:15px}
.fcard.center{align-items:center}
.fico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center}
.fico.sm{width:36px;height:36px;border-radius:10px}
.fico.big{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);box-sizing:border-box}
.fbody{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fhead b{font-size:16px;overflow-wrap:anywhere}
.ftag{font-size:12px;color:var(--muted);flex:0 0 auto}
.fsets{font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fmet{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fmins{flex:0 0 auto;font-size:15px;font-variant-numeric:tabular-nums}
.prb{height:22px;padding:0 8px;border-radius:11px;background:var(--good);color:var(--on-good);font-weight:700;display:inline-flex;align-items:center;font-size:12px}
.fbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fmin .row-l,.frow .row-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.frow .row-l>span:first-child{font-size:15px}
.fmin{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.fmin-r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.stepper button{width:36px;height:36px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;padding:0;color:var(--fg)}
.stepper button.go{background:var(--good);border-color:var(--good);color:var(--on-good)}
.stepper button:disabled{opacity:.4}
.stepper .v{min-width:52px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.flink{font-size:12px;color:var(--good);background:var(--good-soft);border-radius:10px;padding:8px 10px;line-height:1.6}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;color:var(--fg)}
.fchip.sm{height:30px;padding:0 10px;font-size:12px}
.fchip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
.fprow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;box-sizing:border-box;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;color:var(--fg);font-size:16px}
.fp-n{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}

.demobar{flex-wrap:wrap;row-gap:6px}

function relDay(k){var tk=todayKey(),d=parseKey(k);return k===tk?'今天':k===addDays(tk,-1)?'昨天':d.getFullYear()!==parseKey(tk).getFullYear()?d.getFullYear()+' 年':Math.round((parseKey(tk)-d)/864e5)+' 天前';}
function mdw(k){var d=parseKey(k);return (d.getMonth()+1)+'月'+d.getDate()+'日 · 週'+WD[d.getDay()];}

/* habit link */
function fitLinked(){return db.habits.filter(function(h){return h.fitLink&&!h.archived&&h.kind==='good';});}
function fitTarget(h){var m=String(h.name).match(/(\d+)\s*(分鐘|分|min)/i);return m?+m[1]:0;}
function fitMinutes(k){var l=fLog(k);if(!l)return {c:0,s:0,tot:0,any:false};var c=(l.c||[]).reduce(function(a,x){return a+x.min;},0),s=l.min||0;
  return {c:c,s:s,tot:c+s,any:!!((l.s&&l.s.length)||(l.c&&l.c.length)||s)};}
function unAuto(k,id){var l=db.logs[k];if(l&&l.fa){var i=l.fa.indexOf(id);if(i>=0)l.fa.splice(i,1);if(!l.fa.length)delete l.fa;}}
function fitSync(k){
  if(!fOn())return;
  var fm=fitMinutes(k),fa=((db.logs[k]||{}).fa||[]).slice(),changed=false;
  db.habits.forEach(function(h){
    if(h.kind!=='good'||h.archived||!h.fitLink)return;
    var auto=fa.indexOf(h.id)>=0,on=val(k,h.id)>0;
    var tg=fitTarget(h),ok=tg?fm.tot>=tg:fm.any;
    if(ok&&!on){var l=db.logs[k]||(db.logs[k]={});l.h=l.h||{};l.h[h.id]=1;if(k<h.created)h.created=k;fa.push(h.id);changed=true;}
    else if(!ok&&on&&auto){delete db.logs[k].h[h.id];fa.splice(fa.indexOf(h.id),1);changed=true;}
  });
  if(changed){var L=db.logs[k]||(db.logs[k]={});if(fa.length)L.fa=fa;else delete L.fa;tidy(k);}
}
function fitLinkMsg(h,k){var tg=fitTarget(h),fm=fitMinutes(k),on=val(k,h.id)>0;
  if(!tg)return '「'+esc(h.name)+'」：這天有運動紀錄就自動打勾'+(on?'，已打勾 ✓':'');
  return '「'+esc(h.name)+'」：有氧 '+fm.c+' 分 ＋ 重訓 '+fm.s+' 分 ＝ '+fm.tot+' 分，'+(on?'已打勾 ✓':'還差 '+(tg-fm.tot)+' 分');}

      (ui.fpHelp&&!bw?'<div class="fhelp">'+RM_HELP+'</div>':'')+

var QICON='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4M12 17h.01"/></svg>';
var RM_HELP='<b>1RM</b>是「最多只能舉起一下」的重量。不用真的去試極限，App 用每組的重量和次數推算（Epley 公式：重量 ×（1 ＋ 次數 ÷ 30）），取當天最好的一組。所以 60 kg × 10 下和 65 kg × 5 下也能放在一起比較。次數超過 12 下時推算不準，那組不列入。';
function fitChart(H,data,unitTxt,name){
  var W=318,Ht=170,top=12,L=30,lo=Infinity,hi=-Infinity;
  data.forEach(function(h){if(h.m>0){lo=Math.min(lo,h.m);hi=Math.max(hi,h.m);}});
  if(lo===Infinity){lo=0;hi=1;}var pad=(hi-lo)*0.15||Math.max(1,hi*0.05);lo=Math.max(0,lo-pad);hi+=pad;
  var t0=parseKey(data[0].k).getTime(),t1=parseKey(data[data.length-1].k).getTime(),span=Math.max(1,t1-t0);
  var X=function(k){return L+(W-L-8)*(parseKey(k).getTime()-t0)/span;},Y=function(v){return top+(Ht-top)*(1-(v-lo)/(hi-lo));};
  var runMax=null;H.forEach(function(h){if(h.k<data[0].k&&h.m>0)runMax=Math.max(runMax||0,h.m);});
  var line='',dots='',prs='',first=true,circ=function(x,y,r){return 'M'+(x-r).toFixed(1)+' '+y.toFixed(1)+'a'+r+' '+r+' 0 1 0 '+(2*r)+' 0a'+r+' '+r+' 0 1 0 '+(-2*r)+' 0';};
  data.forEach(function(h){if(!(h.m>0))return;var x=X(h.k),y=Y(h.m);line+=(first?'M':'L')+x.toFixed(1)+' '+y.toFixed(1);first=false;
    if(runMax!==null&&h.m>runMax)prs+=circ(x,y,data.length>20?3.5:4.5);else if(data.length<=24)dots+=circ(x,y,2.5);
    runMax=Math.max(runMax||0,h.m);});
  var grid='';for(var g=0;g<4;g++){var gy=(top+(Ht-top)*g/3).toFixed(1);grid+='M'+L+' '+gy+'H'+W;}
  var lastX=X(data[data.length-1].k).toFixed(1),firstX=X(data[0].k).toFixed(1);
  return '<svg class="chart" viewBox="0 0 '+W+' '+(Ht+4)+'" role="img" aria-label="'+esc(name)+' 趨勢，最近一次 '+fmtW(data[data.length-1].m,unitTxt)+'">'+
    '<path d="'+grid+'" stroke="var(--line-soft)" stroke-width="1" fill="none"/>'+
    '<path d="'+line+'L'+lastX+' '+Ht+'L'+firstX+' '+Ht+'Z" fill="var(--good-soft)" stroke="none"/>'+
    '<path d="'+line+'" stroke="var(--good)" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<path d="'+dots+'" fill="var(--good)"/><path d="'+prs+'" fill="var(--surface)" stroke="var(--good)" stroke-width="2.5"/>'+
    '<text x="0" y="'+(top+4)+'" font-size="10" fill="var(--muted)">'+Math.round(hi)+'</text><text x="0" y="'+Ht+'" font-size="10" fill="var(--muted)">'+Math.round(lo)+'</text></svg>'+
    '<div class="chart-x"><span>'+shortMD(data[0].k)+'</span><span>'+shortMD(data[data.length-1].k)+'</span></div>';
}
function fitPartsHTML(){
  var t=todayKey(),ms=t.slice(0,8)+'01',cnt={},lastK={};
  Object.keys(db.fit.logs).forEach(function(k){var seen={};(db.fit.logs[k].s||[]).forEach(function(en){var e=exById(en.ex);if(!e)return;
    if(!lastK[e.part]||k>lastK[e.part])lastK[e.part]=k;if(k>=ms&&!seen[e.part]){seen[e.part]=1;cnt[e.part]=(cnt[e.part]||0)+1;}});});
  if(!Object.keys(lastK).length)return '';
  var mx=Math.max.apply(null,PARTS.map(function(p){return cnt[p]||0;}).concat([1]));
  var stale=PARTS.filter(function(p){return lastK[p]&&(parseKey(t)-parseKey(lastK[p]))/864e5>10;}).map(function(p){return [p,Math.round((parseKey(t)-parseKey(lastK[p]))/864e5)];}).sort(function(a,b){return b[1]-a[1];});
  return '<section class="sec"><div class="sec-row"><h2 class="sec-t">這個月練了哪些部位</h2><span class="small muted">天數</span></div><div class="panel">'+
    PARTS.map(function(p){var c=cnt[p]||0,st=stale.some(function(x){return x[0]===p;});return '<div class="prow"><span>'+p+'</span><span class="fbar"><i class="'+(st?'low':'')+'" style="width:'+(c/mx*100)+'%"></i></span><span class="'+(st?'bad-t':'')+'" style="text-align:right">'+c+'</span></div>';}).join('')+
    (stale.length?'<p class="small bad-t">'+stale.slice(0,2).map(function(x){return x[0]+'已經 '+x[1]+' 天沒練了';}).join('，')+'</p>':'')+'</div></section>';
}
function fitCardioHTML(){
  var any=Object.keys(db.fit.logs).some(function(k){return (db.fit.logs[k].c||[]).length;});if(!any)return '';

function fpList(){

      var rec=act.filter(function(e){return e.part===p;}).map(function(e){return {e:e,lb:lastBefore(e.id,addDays(t,1))};}).filter(function(x){return x.lb;})
        .sort(function(a,b){return a.lb.k<b.lb.k?1:-1;}).slice(0,3);
      if(rec.length)s+='<section class="sec"><h2 class="lbl">最近練過</h2><div class="list">'+rec.map(function(x){var ls=x.lb.sets[x.lb.sets.length-1];

/* turn http(s) URLs in plain text into links; everything else stays escaped text */
var URL_RE=/(https?:\/\/|www\.)[^\s<>"'，。、；：！？「」『』（）【】《》]+/gi;
function linkify(text){
  text=String(text==null?'':text);var out='',last=0,m;URL_RE.lastIndex=0;
  while((m=URL_RE.exec(text))){
    var raw=m[0],trail=raw.match(/[.,;:!?)\]}'"]+$/);if(trail)raw=raw.slice(0,-trail[0].length);
    var href=/^www\./i.test(raw)?'https://'+raw:raw;
    out+=esc(text.slice(last,m.index));
    if(/^https?:\/\/[^\s/]+\.[^\s]+/i.test(href)||/^https?:\/\/localhost/i.test(href)){
      var show=raw.replace(/^https?:\/\//i,'');
      if(show.length>36){var pt=show.split('/'),c2=pt.length>2?pt[0]+'/'+pt[1]+'/…':'';show=c2&&c2.length<=36?c2:pt.length>1&&pt[0].length<=34?pt[0]+'/…':show.slice(0,33)+'…';}
      out+='<a class="ulink" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(show)+'</a>';
    }else out+=esc(raw);
    last=m.index+raw.length;URL_RE.lastIndex=last;
  }
  return out+esc(text.slice(last));
}

function tidy(k){var l=db.logs[k];if(!l)return;if(l.h&&!Object.keys(l.h).length)delete l.h;if(!l.note)delete l.note;if(l.mood==null)delete l.mood;if(typeof l.pnl!=='number')delete l.pnl;if(!l.rest)delete l.rest;if(l.diary&&!l.diary.t&&!l.diary.q)delete l.diary;if(l.fa&&!l.fa.length)delete l.fa;if(!Object.keys(l).length)delete db.logs[k];}
function setVal(k,id,v){
  var l=db.logs[k]||(db.logs[k]={});l.h=l.h||{};
  if(v>0)l.h[id]=v;else delete l.h[id];
  var h=byId(id);if(h&&v>0&&k<h.created)h.created=k;

}
function sched(h,k){return h.kind!=='good'||!!h.days[parseKey(k).getDay()];}
function isRest(k){var l=db.logs[k];return !!(l&&l.rest);}
function scheduled(h,k){return sched(h,k)&&!(h.kind==='good'&&isRest(k)&&!isDone(h,k));}
function goodStreak(h,k){
  var n=0,d=k;if(!isDone(h,d))d=addDays(d,-1);
  for(var i=0;i<4000&&d>=h.created;i++){if(scheduled(h,d)){if(isDone(h,d))n++;else break;}d=addDays(d,-1);}
  return n;
}
function bestStreak(h,end){
  var best=0,run=0,d=h.created;
  for(var i=0;i<4000&&d<=end;i++){if(scheduled(h,d)){if(isDone(h,d)){run++;if(run>best)best=run;}else run=0;}d=addDays(d,1);}
  return best;
}
function cleanDays(h,k){
  var d=addDays(k,-1);
  for(var i=0;i<4000&&d>=h.created;i++){if(val(d,h.id)>0)return diffDays(k,d);d=addDays(d,-1);}
  return Math.max(1,diffDays(k,h.created)+1);
}

/* ---------- daily goal (count habits) ---------- */
var GOAL_ALL='2000-01-01';
function goalOn(h,k){if(!h||h.kind!=='good'||h.method!=='count')return 1;var n=1;(h.goalHist||[]).forEach(function(e){if(e.from<=k)n=e.n;});return n;}
function isDone(h,k){return val(k,h.id)>=goalOn(h,k);}
function isAmt(h){return !!h&&h.kind==='good'&&h.method==='count';}
function hUnit(h){return isAmt(h)?(h.unit||'次'):'次';}
function hStep(h){return isAmt(h)?(h.step||1):1;}
function amtTxt(h,v){return fmtN(v)+(hUnit(h)==='次'?' 次':' '+hUnit(h));}
/* changing "每按一次" rescales past records so one old press still equals one press */
function rescaleStep(h,s0,s1){if(s0===s1||!s0||!s1)return;var r=s1/s0;
  Object.keys(db.logs).forEach(function(k){var l=db.logs[k];if(l.h&&l.h[h.id])l.h[h.id]=Math.max(1,Math.min(999999,Math.round(l.h[h.id]*r)));});
  (h.goalHist||[]).forEach(function(e){e.n=Math.max(1,Math.min(999999,Math.round(e.n*r)));});}
function setGoal(h,n,isNew){n=clampInt(n,1,999999,1);
  if(isNew){h.goalHist=n>1?[{from:GOAL_ALL,n:n}]:[];return;}
  var t=todayKey();if(goalOn(h,t)===n)return;h.goalHist=h.goalHist||[];var last=h.goalHist[h.goalHist.length-1];
  if(last&&last.from===t)last.n=n;else h.goalHist.push({from:t,n:n});}

/* ---------- savings ---------- */
function amtOn(h,k){var a=0;(h.saveHist||[]).forEach(function(e){if(e.from<=k)a=e.amt;});return a;}
function setSave(h,amt,from){
  var t=todayKey();amt=Math.max(0,Math.round(+amt)||0);
  var first=!(h.saveHist||[]).some(function(e){return e.amt>0&&e.from<t;});
  if(first&&amt>0&&isKey(from)&&from<t){h.saveHist=[{from:from,amt:amt}];return;}
  if(amtOn(h,t)===amt)return;
  h.saveHist=h.saveHist||[];var last=h.saveHist[h.saveHist.length-1];
  if(last&&last.from===t)last.amt=amt;else h.saveHist.push({from:t,amt:amt});
}
function savedFor(h,k){
  var a=amtOn(h,k);if(!a)return 0;var v=val(k,h.id);
  if(h.kind==='good')return h.method==='count'?Math.floor(v/hStep(h))*a:(v>0?a:0);
  return (db.logs[k]&&!(v>0))?a:0;
}
function savingsTotals(){
  var t=todayKey(),ms=t.slice(0,8)+'01',all=0,mon=0,per={},from=null;
  db.habits.forEach(function(h){(h.saveHist||[]).forEach(function(e){if(e.amt>0&&(!from||e.from<from))from=e.from;});});
  Object.keys(db.logs).forEach(function(k){
    if(k>t)return;
    db.habits.forEach(function(h){
      var v=savedFor(h,k);if(!v)return;all+=v;
      if(k>=ms){mon+=v;var p=per[h.id]||(per[h.id]={h:h,n:0,amt:0});p.n+=Math.max(1,Math.round(v/amtOn(h,k)));p.amt+=v;}
    });
  });
  var spent=db.redeemed.reduce(function(a,x){return a+(x.amount||0);},0);
  return {all:all,mon:mon,per:per,spent:spent,avail:all-spent,from:from};
}
function anySave(){return db.habits.some(function(h){return (h.saveHist||[]).some(function(e){return e.amt>0;});});}

/* ---------- rest cards ---------- */
var REST_PER_MONTH=2;
function restUsed(k){var ms=k.slice(0,8)+'01',me=monthEndKey(k);return Object.keys(db.logs).filter(function(x){return x>=ms&&x<=me&&db.logs[x].rest;}).length;}
function restUI(k){
  var t=todayKey();if(k>=t||diffDays(t,k)>7)return '';
  var mo=(parseKey(k).getMonth()+1)+'月';
  if(isRest(k))return '<div class="restbar on"><span>這天用了休息卡，沒做到的好習慣不會中斷連續，也不算進完成率。</span><button class="ghost" data-act="unrest">取消休息</button></div>';
  var missed=active('good').filter(function(h){return sched(h,k)&&k>=h.created&&!isDone(h,k);});
  if(!missed.length)return '';
  var left=REST_PER_MONTH-restUsed(k);
  return '<div class="restbar"><span>這天沒做到 '+missed.length+' 項。生病或有事的話，可以用休息卡補這一天。</span>'+
    '<button class="darkbtn" data-act="userest"'+(left>0?'':' disabled')+'>'+(left>0?'用休息卡（'+mo+'剩 '+left+' 張）':mo+'的休息卡用完了')+'</button></div>';
}

/* ---------- rewards ---------- */
function monthEndKey(k){var d=parseKey(k);return keyOf(new Date(d.getFullYear(),d.getMonth()+1,0));}
function nextMonthKey(k){var d=parseKey(k);return keyOf(new Date(d.getFullYear(),d.getMonth()+1,1));}
function weekStartKey(k){var d=parseKey(k);return addDays(k,-((d.getDay()+6)%7));}
function maxK(){var a=[].slice.call(arguments).filter(Boolean).sort();return a[a.length-1];}
function rById(id){for(var i=0;i<db.rewards.length;i++)if(db.rewards[i].id===id)return db.rewards[i];return null;}
function streakSince(h,end,since){
  var n=0,last=null,d=end;if(!isDone(h,d))d=addDays(d,-1);
  for(var i=0;i<4000&&d>=h.created&&(!since||d>since);i++){
    if(scheduled(h,d)){if(isDone(h,d)){n++;if(!last)last=d;}else break;}
    d=addDays(d,-1);
  }
  return {n:n,last:last};
}
function weekCount(h,w,from,t){var c=0;for(var i=0;i<7;i++){var d=addDays(w,i);if(d>=from&&d>=h.created&&d<=t&&isDone(h,d))c++;}return c;}
function monthResult(r,h,m,to){
  var from=maxK(m,r.created,h.created),sc=0,dn=0,slips=0;
  for(var d=from;d<=to;d=addDays(d,1)){
    if(r.type==='rate'){if(scheduled(h,d)){sc++;if(isDone(h,d))dn++;}}
    else slips+=val(d,h.id);
  }
  return r.type==='rate'?{rate:sc?Math.round(dn/sc*100):0,sc:sc}:{slips:slips};
}
function syncRewards(){
  var t=todayKey(),changed=false;
  db.rewards.forEach(function(r){
    if(r.done||r.type==='saved')return;
    var h=byId(r.habit);if(!h||h.archived)return;
    if(!r.repeat&&r.earned.length)return;
    if(r.type==='streak'){
      var st=streakSince(h,t,r.earned.length?r.earned[r.earned.length-1]:null);
      if(st.n>=r.target&&st.last){r.earned.push(st.last);changed=true;}
    }else if(r.type==='weekly'){
      for(var w=weekStartKey(r.created);w<=t;w=addDays(w,7)){
        if(r.earned.indexOf(w)>=0)continue;
        if(weekCount(h,w,r.created,t)>=r.target){r.earned.push(w);changed=true;if(!r.repeat)break;}
      }
    }else{
      for(var m=r.created.slice(0,8)+'01';monthEndKey(m)<t;m=nextMonthKey(m)){
        if(r.earned.indexOf(m)>=0)continue;
        var res=monthResult(r,h,m,monthEndKey(m));
        var ok=r.type==='rate'?(res.sc>0&&res.rate>=r.target):res.slips<=r.target;
        if(ok){r.earned.push(m);changed=true;if(!r.repeat)break;}
      }
    }
  });
  if(changed)save();
}
function redCount(rid){return db.redeemed.filter(function(x){return x.rid===rid;}).length;}
function pending(r,tot){
  if(r.done)return 0;
  if(r.type==='saved')return r.target>0&&tot.avail>=r.target?1:0;
  var h=byId(r.habit);if(!h||h.archived)return 0;
  return Math.max(0,r.earned.length-redCount(r.id));
}
function pctOf(a,b){return b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):0;}
function ruleText(r,h,ml){
  var hn=h?'「'+esc(h.name)+'」':'「（已刪除的習慣）」',t=r.target,mm=ml||'這個月';
  return {streak:hn+'連續做到 '+t+' 天',weekly:'一週內'+hn+'做到 '+t+' 天',rate:mm+hn+'完成率達到 '+t+'%',
    limit:mm+hn+'最多犯 '+t+' 次',saved:'省下的錢累計到 NT$'+fmtN(t)}[r.type];
}
function progressOf(r,h,tot){
  var t=todayKey(),me=monthEndKey(t),settle=shortMD(me)+' 結算';
  if(r.type==='saved')return {txt:'NT$'+fmtN(Math.max(0,tot.avail))+' / '+fmtN(r.target),pct:pctOf(tot.avail,r.target)};
  if(!h)return {txt:'',pct:0};
  if(h.archived)return {txt:'暫停中',pct:0,cls:'paused',note:'習慣已封存，恢復後會繼續計算。'};
  if(r.type==='streak'){var n=streakSince(h,t,r.earned.length?r.earned[r.earned.length-1]:null).n;return {txt:n+' / '+r.target+' 天',pct:pctOf(n,r.target)};}
  if(r.type==='weekly'&&r.earned.indexOf(weekStartKey(t))>=0)return {txt:'本週已達成',pct:100,note:r.repeat?'下週重來':''};
  if(r.type==='weekly'){var c=weekCount(h,weekStartKey(t),r.created,t);return {txt:'本週 '+c+' / '+r.target+' 天',pct:pctOf(c,r.target)};}
  var m=t.slice(0,8)+'01';
  if(r.created>me)return {txt:'',pct:0};
  var res=monthResult(r,h,m,t);
  if(r.type==='rate')return {txt:'目前 '+res.rate+'%',pct:pctOf(res.rate,r.target),note:settle};
  var over=res.slips>r.target;
  return {txt:over?'已超過 '+(res.slips-r.target)+' 次':'剩 '+(r.target-res.slips)+' 次額度',pct:r.target?pctOf(res.slips,r.target):(res.slips?100:0),cls:over?'over':'',
    note:'目前犯了 '+res.slips+' 次 · '+(over?(r.repeat?'這個月沒達成，下個月重來':'這次沒達成'):settle)};
}
function rewardBanner(){
  syncRewards();var tot=savingsTotals();

function prevPnlKey(k){var ks=pnlKeys(),r=null;for(var i=0;i<ks.length&&ks[i]<k;i++)r=ks[i];return r;}
function fmtN(v){return Math.abs(v).toLocaleString('en-US');}
function cmpN(v){var a=Math.abs(v);if(a<1e5)return a.toLocaleString('en-US');if(a<1e7)return (Math.round(a/1e3)/10).toLocaleString('en-US')+'萬';if(a<1e8)return Math.round(a/1e4).toLocaleString('en-US')+'萬';return (Math.round(a/1e6)/100)+'億';}

function monthChange(y,m,endKey){
  var start=keyOf(new Date(y,m,1)),end=keyOf(new Date(y,m+1,0));if(endKey&&end>endKey)end=endKey;

function pnlStats(y,m){
  var t=todayKey(),h=hid(),end=keyOf(new Date(y,m+1,0));if(end>t)end=t;
  var now=new Date(),isCur=y===now.getFullYear()&&m===now.getMonth();
  var mc=keyOf(new Date(y,m,1))>t?null:monthChange(y,m,end);
  if(!mc)return '<div class="empty"><div class="empty-t">這個月沒有紀錄</div><p>每天收盤後記下帳面上的未實現損益，這裡會畫出走勢。</p>'+
    (isCur?'<button class="primary" data-act="pnlopen" data-k="'+t+'">輸入今天的數字</button>':'')+'</div>';
  var ks=mc.keys,vals=ks.map(pnlAt),sel=ks.indexOf(ui.pnlSel);if(sel<0)sel=ks.length-1;
  var sk=ks[sel],sv=vals[sel],pk=prevPnlKey(sk),sd=pk!=null?sv-pnlAt(pk):null,ds=parseKey(sk);
  var W=320,H=170,L=10,R=10,T=16,B=12;
  var all=vals.slice();if(mc.baseKey)all.push(mc.base);
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pad=(hi-lo)*0.12||Math.max(1,Math.abs(hi)*0.05);lo-=pad;hi+=pad;
  function X(i){return ks.length===1?W/2:L+i*(W-L-R)/(ks.length-1);}
  function Y(v){return T+(hi-v)/(hi-lo)*(H-T-B);}
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(m+1)+'月未實現損益走勢，共 '+ks.length+' 筆紀錄">';
  if(lo<0&&hi>0)svg+='<line x1="0" x2="'+W+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(W-2)+'" y="'+(Y(0)-4).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--faint)">0</text>';

/* ---------- search ---------- */
function snip(text,terms){
  if(text.length<=140)return text;
  var i=terms.length?text.toLowerCase().indexOf(terms[0]):0;if(i<0)i=0;
  var st=Math.max(0,i-40);
  return (st>0?'…':'')+text.slice(st,st+140)+(st+140<text.length?'…':'');
}
function highlight(text,terms){
  if(!terms.length)return esc(text);
  var low=text.toLowerCase(),out='',i=0;
  while(i<text.length){
    var best=-1,len=0;
    terms.forEach(function(t){var j=low.indexOf(t,i);if(j>=0&&(best<0||j<best||(j===best&&t.length>len))){best=j;len=t.length;}});
    if(best<0){out+=esc(text.slice(i));break;}
    out+=esc(text.slice(i,best))+'<mark>'+esc(text.slice(best,best+len))+'</mark>';i=best+len;
  }
  return out;
}
function searchResults(){
  var raw=(ui.q||'').trim(),terms=raw?raw.toLowerCase().split(/\s+/):[];

  var head=raw?(hits.length?'找到 '+hits.length+' 筆':'找不到「'+esc(raw)+'」'):'全部'+what+' · '+items.length+' 筆';
  var s='<p class="small muted res-count">'+head+'</p>';

/* ---------- ranking ---------- */
function rankMonth(y,m){
  var t=todayKey(),ms=keyOf(new Date(y,m,1)),me=keyOf(new Date(y,m+1,0)),to=me>t?t:me,good=[],bad=[];
  if(ms>t)return {good:[],bad:[],ms:ms,me:me};
  db.habits.forEach(function(h){
    if(h.archived||h.created>to)return;
    var from=ms>h.created?ms:h.created;
    if(h.kind==='good'){
      var sc=0,dn=0;for(var d=from;d<=to;d=addDays(d,1)){if(scheduled(h,d)){sc++;if(isDone(h,d))dn++;}}
      var tot=0,nd=0;if(isAmt(h))for(var d3=from;d3<=to;d3=addDays(d3,1)){tot+=val(d3,h.id);nd++;}
      good.push({h:h,sc:sc,dn:dn,rate:sc?Math.round(dn/sc*100):0,st:goodStreak(h,to),ok:sc>=7,tot:tot,nd:nd});
    }else{
      var sl=0,days=0;for(var d2=from;d2<=to;d2=addDays(d2,1)){sl+=val(d2,h.id);days++;}
      bad.push({h:h,sl:sl,days:days,clean:val(to,h.id)>0?0:cleanDays(h,to),ok:days>=7});
    }
  });
  good.sort(function(a,b){return (b.ok-a.ok)||(b.rate-a.rate)||(b.st-a.st)||(a.h.name<b.h.name?-1:1);});
  bad.sort(function(a,b){return (b.ok-a.ok)||(a.sl-b.sl)||(b.clean-a.clean)||(a.h.name<b.h.name?-1:1);});
  var r=1;good.forEach(function(x){x.rank=x.ok?r++:null;});r=1;bad.forEach(function(x){x.rank=x.ok?r++:null;});
  return {good:good,bad:bad,ms:ms,me:me};
}
function amtLine(x){if(!isAmt(x.h)||!x.nd)return '';return '<span class="rk-amt">本月共 '+esc(amtTxt(x.h,x.tot))+' · 平均每天 '+esc(amtTxt(x.h,Math.round(x.tot/x.nd)))+'</span>';}
function rankChange(x,prev,prevMe){
  if(x.h.created>prevMe)return '<span class="rk-new">新</span>';
  var p=null;prev.forEach(function(y){if(y.h.id===x.h.id)p=y.rank;});
  if(!x.rank||!p||p===x.rank)return '<span class="rk-c same">—</span>';
  return p>x.rank?'<span class="rk-c up">▲'+(p-x.rank)+'</span>':'<span class="rk-c down">▼'+(x.rank-p)+'</span>';
}
function rankingHTML(y,m){
  var cur=rankMonth(y,m),py=m?y:y-1,pm=m?m-1:11,prev=rankMonth(py,pm),prevMe=keyOf(new Date(py,pm+1,0)),s='';
  function ico(h){return rowIco(h)||'<span class="sico" aria-hidden="true"></span>';}
  function rows(list,isGood){
    var main=list.filter(function(x){return x.ok;}),fresh=list.filter(function(x){return !x.ok;}),out='';
    out+=main.map(function(x){
      var first=x.rank===1,sub,valTxt;
      if(isGood){sub=(x.st?'連續 '+x.st+' 天 · ':'')+x.dn+' / '+x.sc+' 天'+amtLine(x);valTxt=x.rate+'%';}
      else{sub=x.clean?'已 '+x.clean+' 天沒犯':'這天有犯';valTxt=x.sl+' 次';}
      return '<div class="rk"><div class="rk-top"><span class="rk-n'+(first?' first':'')+'">'+x.rank+'</span>'+ico(x.h)+
        '<div class="rk-t"><span class="rk-name">'+esc(x.h.name)+'</span><span class="rk-sub">'+sub+'</span></div>'+
        '<div class="rk-v"><span class="rk-val">'+valTxt+'</span>'+rankChange(x,isGood?prev.good:prev.bad,prevMe)+'</div></div>'+
        (isGood?'<div class="rk-bar"><i class="'+(first?'first':'')+'" style="width:'+x.rate+'%"></i></div>':'')+'</div>';
    }).join('');
    if(fresh.length){
      out+='<div class="rk-sep">天數還少（本月'+(isGood?'排定':'記錄')+'不到 7 天）</div>'+fresh.map(function(x){
        var since=x.h.created>=cur.ms?shortMD(x.h.created)+' 才開始 · ':'';
        var sub=isGood?since+x.dn+' / '+x.sc+' 天'+amtLine(x):since+x.days+' 天';
        var v=isGood?(x.sc?x.rate+'%':'—'):x.sl+' 次';
        return '<div class="rk fresh"><div class="rk-top"><span class="rk-n">·</span>'+ico(x.h)+
          '<div class="rk-t"><span class="rk-name">'+esc(x.h.name)+'</span><span class="rk-sub">'+sub+'</span></div>'+
          '<div class="rk-v"><span class="rk-val">'+v+'</span>'+rankChange(x,isGood?prev.good:prev.bad,prevMe)+'</div></div></div>';
      }).join('');
    }
    return out;
  }
  var pl='和 '+(pm+1)+' 月比';
  if(cur.good.length)s+='<section class="sec"><div class="sec-row"><h2 class="sec-t good-t">好習慣排行</h2><span class="small muted">本月完成率 · '+pl+'</span></div><div class="list">'+rows(cur.good,true)+'</div></section>';
  if(cur.bad.length)s+='<section class="sec"><div class="sec-row"><h2 class="sec-t bad-t">壞習慣排行</h2><span class="small muted">犯最少的排前面 · '+pl+'</span></div><div class="list">'+rows(cur.bad,false)+'</div></section>';
  if(s)s+='<p class="small muted">名次變化是和上個月比較，這個月才建立的習慣標「新」。休息日不算進完成率。完成率一樣時，連續天數長的排前面；壞習慣次數一樣時，沒犯的天數長的排前面。</p>';
  return s;
}

function vStats(){
  var t=todayKey(),now=new Date();
  if(!ui.month)ui.month=[now.getFullYear(),now.getMonth()];
  var y=ui.month[0],m=ui.month[1];
  var first=new Date(y,m,1),lastDay=new Date(y,m+1,0).getDate();
  var isCur=y===now.getFullYear()&&m===now.getMonth();
  var goods=active('good'),bads=active('bad');
  var pOn=!!db.settings.pnl,tabs=[['habits','習慣']];
  if(pOn)tabs.push(['pnl',dOn()?'損益':'未實現損益']);
  if(dOn())tabs.push(['diary','日記']);
  var tab=tabs.some(function(x){return x[0]===ui.statTab;})?ui.statTab:'habits';
  var s='<div class="page"><header class="titlebar"><h1 class="h1">統計</h1><button class="iconbtn" data-act="search" aria-label="'+(dOn()?'搜尋備註和日記':'搜尋備註')+'">'+I.search+'</button></header>';
  if(tabs.length>1)s+='<div class="seg'+(tabs.length>2?' three':'')+'">'+tabs.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" data-act="stab" data-v="'+x[0]+'" aria-pressed="'+(tab===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
  s+='<div class="monthnav" style="justify-content:center"><button class="iconbtn" data-act="month" data-n="-1" aria-label="上個月">'+I.left+'</button>'+
    '<div class="month-l">'+y+' 年 '+(m+1)+' 月</div>'+
    '<button class="iconbtn" data-act="month" data-n="1" aria-label="下個月"'+(isCur||first>now?' disabled':'')+'>'+I.right+'</button></div>';
  if(tab==='pnl')return s+pnlStats(y,m)+'</div>';
  if(tab==='diary')return s+diaryStats(y,m)+'</div>';
  if(!goods.length&&!bads.length){
    return s+'<div class="empty"><div class="empty-t">還沒有資料</div><p>先到「習慣設定」新增習慣，記錄幾天後這裡就會出現月曆和趨勢。</p><button class="primary" data-act="new">新增習慣</button></div></div>';
  }
  var S=0,D=0,B=0,cells=[];
  for(var b=0;b<first.getDay();b++)cells.push('<span class="cell blank"></span>');
  for(var d=1;d<=lastDay;d++){
    var k=keyOf(new Date(y,m,d));
    if(k>t){cells.push('<span class="cell future">'+d+'</span>');continue;}
    var sc=0,dn=0;
    goods.forEach(function(h){if(k>=h.created&&scheduled(h,k)){sc++;if(isDone(h,k))dn++;}});
    var bb=bads.reduce(function(a,h){return a+val(k,h.id);},0);
    S+=sc;D+=dn;B+=bb;
    var r=sc?dn/sc:0,lv=(!sc||!dn)?0:(r>=1?3:(r>=0.5?2:1));
    cells.push('<button class="cell'+(lv?' l'+lv:'')+(k===t?' today':'')+'" data-act="pickday" data-k="'+k+'" aria-label="'+(m+1)+'月'+d+'日，好習慣 '+dn+'/'+sc+(bb?'，壞習慣 '+bb+' 次':'')+'">'+d+(bb?'<i class="dot"></i>':'')+'</button>');
  }
  s+='<div class="panel"><div class="heat">'+WD.map(function(w){return '<div class="wd">'+w+'</div>';}).join('')+'</div><div class="heat">'+cells.join('')+'</div>'+
    '<div class="legend"><span>少 <i class="sw" style="background:var(--chip)"></i><i class="sw" style="background:var(--h1)"></i><i class="sw" style="background:var(--h2)"></i><i class="sw" style="background:var(--good)"></i> 多</span><span><i class="sw" style="width:6px;height:6px;border-radius:3px;background:var(--bad)"></i> 有壞習慣</span></div>'+
    '<p class="small muted">點日期可以回去補記那一天。</p></div>';
  var best=goods.reduce(function(a,h){return Math.max(a,bestStreak(h,t));},0);
  s+='<div class="tiles"><div class="tile"><div class="tile-l">本月完成率</div><div class="tile-v good-t">'+(S?Math.round(D/S*100)+'%':'—')+'</div></div>'+
    '<div class="tile"><div class="tile-l">最長連續</div><div class="tile-v">'+best+' 天</div></div>'+
    '<div class="tile"><div class="tile-l">本月壞習慣</div><div class="tile-v bad-t">'+B+' 次</div></div></div>';
  s+=rankingHTML(y,m);
  return s+'</div>';
}

/* ---------- backup encryption (PBKDF2-SHA256 + AES-GCM) ---------- */
var MAX_BACKUP=5e6,KDF_ITER=600000;
function canCrypt(){try{return !!(window.crypto&&crypto.subtle&&window.TextEncoder);}catch(e){return false;}}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(str){var s=atob(str),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function deriveKey(pw,salt,iter){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});
}
function encryptText(text,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return deriveKey(pw,salt,KDF_ITER).then(function(key){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text));})
    .then(function(ct){return JSON.stringify({habitsBackup:1,enc:'AES-GCM',kdf:'PBKDF2-SHA256',iter:KDF_ITER,salt:b64(salt),iv:b64(iv),data:b64(ct)});});
}
function decryptText(o,pw){
  var iter=Math.min(Math.max(+o.iter||KDF_ITER,100000),5000000);
  return deriveKey(pw,unb64(o.salt),iter).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.data));})
    .then(function(pt){return new TextDecoder().decode(pt);});
}
function isEncBackup(o){return o&&o.habitsBackup===1&&o.enc==='AES-GCM'&&typeof o.salt==='string'&&typeof o.iv==='string'&&typeof o.data==='string';}
function startExport(){
  if(!canCrypt()){doExport(null);return;}
  ui.sheet={type:'exportpw',err:''};render();var f=$('#pw1');if(f)f.focus();
}
function exportWithPw(){
  var p1=($('#pw1')||{}).value||'',p2=($('#pw2')||{}).value||'';
  if(p1.length<6){ui.sheet.err='密碼至少 6 個字。';render();return;}
  if(p1!==p2){ui.sheet.err='兩次輸入的密碼不一樣。';render();return;}
  ui.sheet={type:'busy',msg:'加密中⋯'};render();
  encryptText(backupPayload(),p1).then(function(t){doExport(t,true);},function(){ui.sheet={type:'exportpw',err:'加密失敗，請再試一次。'};render();});
}
/* backup file naming: time + source, so backups from different browsers or times never share a name */
var SRC_LABEL={app:'主畫面 App',safari:'Safari',chrome:'Chrome',edge:'Edge',firefox:'Firefox',demo:'示範',browser:'瀏覽器'};
function backupSource(){if(DEMO)return 'demo';if(isStandalone())return 'app';var u=navigator.userAgent||'';
  if(/EdgiOS|Edg\//.test(u))return 'edge';if(/FxiOS|Firefox\//.test(u))return 'firefox';if(/CriOS|Chrome\//.test(u))return 'chrome';if(/Safari\//.test(u))return 'safari';return 'browser';}
function backupStamp(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return todayKey()+'-'+p(d.getHours())+p(d.getMinutes());}
function backupPayload(){var o={};for(var k in db)o[k]=db[k];o.meta={exportedAt:new Date().toISOString(),source:backupSource(),app:APP_VER};return JSON.stringify(o);}
function takeMeta(o){if(!o||typeof o!=='object')return null;var m=o.meta;delete o.meta;if(!m||typeof m!=='object')return null;
  var at=new Date(String(m.exportedAt||''));return {at:isNaN(at)?null:at,src:String(m.source||'').slice(0,12)};}
function metaLine(m){if(!m||!m.at)return '';var p=function(n){return String(n).padStart(2,'0');},a=m.at;
  return '<p>備份時間：'+a.getFullYear()+'/'+(a.getMonth()+1)+'/'+a.getDate()+' '+p(a.getHours())+':'+p(a.getMinutes())+(m.src?' · 來自 '+esc(SRC_LABEL[m.src]||m.src):'')+'</p>';}
function doExport(encText,isEnc){
  var text=encText||backupPayload(),name='habits-backup-'+backupStamp()+'-'+backupSource()+(isEnc?'-locked':'')+'.json';
  try{
    var f=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      ui.sheet=null;render();navigator.share({files:[f]}).then(function(){markBackup();render();toast(isEnc?'已匯出加密備份':'已匯出');}).catch(function(e){
        if(e&&e.name==='AbortError'){ui.sheet=null;render();return;}ui.sheet={type:'export',text:text,name:name,enc:!!isEnc};render();
      });
      return;
    }
  }catch(e){}
  ui.sheet={type:'export',text:text,name:name,enc:!!isEnc};render();
}
function copyText(text){
  function fallback(){var ta=$('#exporttext');if(ta){ta.focus();ta.select();}markBackup();toast('已選取內容，請按「拷貝」');}
  try{navigator.clipboard.writeText(text).then(function(){markBackup();toast('已複製，可以貼到備忘錄');},fallback);}catch(e){fallback();}

function unlockImport(){
  var pw=($('#pw3')||{}).value||'',raw=ui.sheet.raw;if(!pw){ui.sheet.err='請輸入密碼。';render();return;}

    if(!d){ui.sheet={type:'import',paste:'',err:'解開了，但內容讀不懂。'};render();return;}
    ui.sheet={type:'confirm',data:d,meta:mt};render();
  },function(){ui.sheet={type:'unlock',raw:raw,err:'密碼不對，請再試一次。'};render();var f=$('#pw3');if(f)f.focus();});
}
function tryImport(text){
  if(text.length>MAX_BACKUP){ui.sheet={type:'import',paste:'',err:'檔案太大，不像是這個 App 的備份。'};render();return;}
  var raw=null;try{raw=JSON.parse(text);}catch(e){}
  if(isEncBackup(raw)){
    if(!canCrypt()){ui.sheet={type:'import',paste:'',err:'這是加密備份，但這個瀏覽器不支援解密。'};render();return;}
    ui.sheet={type:'unlock',raw:raw,err:''};render();var f=$('#pw3');if(f)f.focus();return;
  }
  var d=null,mt=null;try{mt=takeMeta(raw);d=normalize(raw);}catch(e){}
  if(!d){ui.sheet={type:'import',paste:text,err:'讀不懂這份內容，請確認是從這個 App 匯出的備份。'};render();return;}
  ui.sheet={type:'confirm',data:d,meta:mt};render();
}

  if(e.key==='Enter'&&e.target.id==='pw3'){e.preventDefault();unlockImport();return;}
  if(e.key==='Enter'&&e.target.id==='amtin'){e.preventDefault();amountSave();return;}
  if(e.target.id==='hname'&&e.key==='Enter'){e.preventDefault();saveDraft();return;}
  if(ui.view==='search'&&e.key==='Escape'){act('sback',{dataset:{}});return;}
  if(ui.view==='pnl'&&!e.metaKey&&!e.ctrlKey){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();act('pkey',{dataset:{k:e.key}});}
    else if(e.key==='Backspace'){e.preventDefault();act('pkey',{dataset:{k:'del'}});}
    else if(e.key==='-'){e.preventDefault();act('psign',{dataset:{v:ui.pe.neg?'0':'1'}});}
    else if(e.key==='Enter'){e.preventDefault();act('psave',{dataset:{}});}
    else if(e.key==='Escape'){act('pcancel',{dataset:{}});}
  }
});
$('#importFile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  if(f.size>MAX_BACKUP){e.target.value='';ui.sheet={type:'import',paste:'',err:'檔案太大，不像是這個 App 的備份。'};render();return;}
  var r=new FileReader();r.onload=function(){tryImport(String(r.result||''));};r.readAsText(f);e.target.value='';
});

/* drag to reorder in settings */
document.addEventListener('pointerdown',function(e){
  var hd=e.target.closest('[data-drag]');if(!hd)return;
  e.preventDefault();
  try{hd.releasePointerCapture(e.pointerId);}catch(err){}
  ui.dragId=hd.dataset.drag;render();
  function move(ev){
    var el=document.elementFromPoint(ev.clientX,ev.clientY),row=el&&el.closest('[data-row]');
    if(!row||row.dataset.row===ui.dragId)return;
    var a=byId(ui.dragId),b=byId(row.dataset.row);if(!a||!b||a.kind!==b.kind)return;
    var from=db.habits.indexOf(a),bi=db.habits.indexOf(b),down=from<bi;
    db.habits.splice(from,1);bi=db.habits.indexOf(b);db.habits.splice(down?bi+1:bi,0,a);
    render();
  }
  function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);ui.dragId=null;save();render();}
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
});

/* swipe left/right on 今天 to change day */
var sx=null,sy=0;
$('#main').addEventListener('touchstart',function(e){
  if(ui.view!=='today'||e.touches.length!==1||e.target.closest('textarea,input')){sx=null;return;}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;
},{passive:true});
$('#main').addEventListener('touchend',function(e){
  if(sx==null)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)<70||Math.abs(dy)>50)return;
  var k=addDays(ui.date,dx>0?-1:1),today=todayKey();if(k>today)return;
  ui.date=k;ui.follow=k===today;render();
},{passive:true});

/* a new day while the app sat in the background */
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;var t=todayKey();
  if(ui.follow&&ui.date!==t&&ui.view==='today'){ui.date=t;render();}
  else if(ui.follow)ui.date=t;
});

if('serviceWorker' in navigator&&document.documentElement.classList.contains('own-host')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
render();
if(autoIcons)toast('已幫 '+autoIcons+' 個習慣加上圖示，可在「習慣設定」修改',4000);
})();
</script>
