<!doctype html>
<html lang="zh-Hant" class="own-host">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="習慣">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<title>習慣紀錄</title>
<style>
/* Layout: one-screen phone app — a scrolling content column above a three-tab bar; data lives in this browser only */
:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --chip:#ECE7DE; --line:#E2DBCF; --line-soft:#EFEAE1;
  --fg:#1C1B19; --muted:#6B655C; --faint:#9A9388;
  --good:#2F6B52; --good-soft:#E3EFE8; --good-line:#9CC4B0; --on-good:#FFFFFF;
  --bad:#B4471C; --bad-soft:#F8E9E1; --bad-line:#E9BFA9; --on-bad:#FFFFFF;
  --ink:#1C1B19; --on-ink:#FFFFFF;
  --h1:#C6DFD1; --h2:#7FB297;
  --up:#C8283A; --down:#1F7A4A;
  --scrim:rgba(28,27,25,.45);
  --shadow:0 1px 3px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --surface:#22201D; --chip:#2D2A26; --line:#3A3631; --line-soft:#2D2A26;
    --fg:#F1EDE6; --muted:#ABA498; --faint:#7D776D;
    --good:#62B48C; --good-soft:#1C3127; --good-line:#3B6B53; --on-good:#0E1D15;
    --bad:#E8845A; --bad-soft:#3A2219; --bad-line:#6E3A24; --on-bad:#1F0E06;
    --ink:#F1EDE6; --on-ink:#171614;
    --h1:#25402F; --h2:#3D7759;
    --up:#FF6B76; --down:#4CC38A;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 3px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --surface:#22201D; --chip:#2D2A26; --line:#3A3631; --line-soft:#2D2A26;
  --fg:#F1EDE6; --muted:#ABA498; --faint:#7D776D;
  --good:#62B48C; --good-soft:#1C3127; --good-line:#3B6B53; --on-good:#0E1D15;
  --bad:#E8845A; --bad-soft:#3A2219; --bad-line:#6E3A24; --on-bad:#1F0E06;
  --ink:#F1EDE6; --on-ink:#171614;
  --h1:#25402F; --h2:#3D7759;
  --up:#FF6B76; --down:#4CC38A;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 3px rgba(0,0,0,.5);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--good);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding-inline:20px;padding-block:20px 32px;display:flex;flex-direction:column;gap:22px}
.own-host .page{padding-top:calc(16px + env(safe-area-inset-top,0px))}
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-inline:16px;padding-block:4px}
.own-host .tabs{padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:0;background:none;color:var(--muted);font-size:11px}
.tab.on{color:var(--good);font-weight:700}

.h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.sub{font-size:13px;color:var(--muted);letter-spacing:.06em}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar-mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.iconbtn{flex:0 0 auto;width:44px;height:44px;border:0;border-radius:22px;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.linkbtn{align-self:center;border:0;background:none;color:var(--good);font-weight:700;font-size:14px;min-height:36px;margin-top:-14px}

.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum-card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.sum-card.good{background:var(--good);border-color:var(--good);color:var(--on-good)}
.sum-l{font-size:12px;opacity:.85}
.sum-v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.sum-v small{font-size:15px;font-weight:500;opacity:.8}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-t{margin:0;font-size:15px;font-weight:700}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:1.6;margin:0}

.hcard{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;min-height:68px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);text-align:left;color:var(--fg)}
button.hcard{padding-right:16px}
.hcard.g-on{background:var(--good-soft);border-color:var(--good-line)}
.hcard.b-on{background:var(--bad-soft);border-color:var(--bad-line)}
.hc-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.hc-name{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.hc-sub{font-size:12px;color:var(--muted)}
.check{flex:0 0 auto;width:32px;height:32px;border-radius:16px;box-sizing:border-box;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center}
.check.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.check.bad.on{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.counter{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.minus{width:36px;height:36px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.minus:disabled{opacity:.4;cursor:default}
.plus{width:44px;height:44px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;padding:0}
.plus.good{background:var(--good);color:var(--on-good)}
.plus.bad{background:var(--bad);color:var(--on-bad)}
.cnt{min-width:28px;text-align:center;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.cnt.zero{color:var(--faint)}

.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;padding:0}
.mood.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:700}
.lbl{font-size:13px;color:var(--muted)}
input[type=search]{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:100%;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:0 14px;height:48px;font-size:16px}
textarea,input[type=text]{box-sizing:border-box;width:100%;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 14px;font-size:16px}
textarea{resize:none;line-height:1.5}
input[type=text]{height:52px;font-size:17px}

.empty{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty-t{font-size:18px;font-weight:700}
.empty p{margin:0;color:var(--muted);line-height:1.6}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.primary{min-height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--good);color:var(--on-good);font-weight:700}
.primary.danger{background:var(--bad);color:var(--on-bad)}
.secondary{min-height:48px;padding:0 20px;border-radius:24px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}

.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:2px}
.monthnav .iconbtn{background:none}
.month-l{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{text-align:center;font-size:11px;color:var(--muted)}
.cell{position:relative;aspect-ratio:1;max-width:100%;box-sizing:border-box;border-radius:10px;border:0;padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;background:var(--chip);color:var(--fg)}
.cell.blank{background:none}
.cell.future{background:none;color:var(--faint)}
.cell.l1{background:var(--h1)}
.cell.l2{background:var(--h2)}
.cell.l3{background:var(--good);color:var(--on-good)}
.cell.today{box-shadow:0 0 0 2px var(--fg);font-weight:900}
.dot{position:absolute;bottom:4px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:3px;background:var(--bad);box-shadow:0 0 0 1.5px var(--surface)}
.legend{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-l{font-size:11px;color:var(--muted)}
.tile-v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.barcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar-name{font-size:14px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.bar-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.track{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.fill{height:100%;border-radius:4px}

.addbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;padding:0}
.list{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.row:last-child{border-bottom:0}
.row.dragging{background:var(--chip)}
.handle{flex:0 0 auto;width:44px;display:flex;align-items:center;justify-content:center;color:var(--faint);touch-action:none;cursor:grab}
.row-main{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding:12px 14px 12px 0;min-height:60px;border:0;background:none;text-align:left;color:var(--fg)}
.row-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.row-meta{font-size:12px;color:var(--muted)}
.chev{color:var(--faint);flex:0 0 auto}
.row-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;min-height:52px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;font-size:16px;color:var(--fg)}
.list .row-btn:last-child{border-bottom:0}
.row-btn .side{color:var(--muted);display:flex}
.list-empty{min-height:56px;border:1.5px dashed var(--line);border-radius:18px;background:none;color:var(--muted);font-size:15px}
.arch-row{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;min-height:60px;border-bottom:1px solid var(--line-soft)}
.arch-row:last-child{border-bottom:0}
.arch-row .row-text{flex:1 1 auto}
.minibtn{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;flex:0 0 auto}
.minibtn.bad{color:var(--bad)}

.editbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;margin-inline:-8px}
.textbtn{min-width:64px;height:44px;border:0;background:none;color:var(--muted);font-size:16px}
.textbtn.strong{color:var(--good);font-weight:700}
.edit-t{margin:0;text-align:center;font-size:17px;font-weight:700}
.field{display:flex;flex-direction:column;gap:8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.typebtn{min-height:72px;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.typebtn b{font-size:16px}
.typebtn span{font-size:12px;color:var(--muted)}
.typebtn.on span{color:inherit;opacity:.85}
.typebtn.on.good{background:var(--good);border-color:var(--good);color:var(--on-good)}
.typebtn.on.bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:15px}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.hint{margin:0;font-size:12px;color:var(--muted);padding:0 4px;line-height:1.6}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{aspect-ratio:1;max-width:100%;min-height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;padding:0}
.day.on{background:var(--good);border-color:var(--good);color:var(--on-good);font-weight:700}
.danger-zone{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column}
.danger-zone .row-btn{padding:0 4px;border:0}
.err{margin:-12px 0 0;color:var(--bad);font-size:13px}

#sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:85%;overflow-y:auto;box-sizing:border-box;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px}
.sheet p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
.sheet .err0{color:var(--bad)}
.sheet textarea.code{font-family:var(--mono);font-size:12px}
.stack{display:flex;flex-direction:column;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;z-index:20;max-width:calc(100% - 48px);text-align:center}
.hc-lead{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px}
.hico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center}
.g-on .hico,.b-on .hico{background:var(--surface)}
.sico{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center}
.namerow{display:flex;gap:8px;align-items:center}
.namerow input{flex:1 1 auto;min-width:0}
.icobtn{flex:0 0 auto;width:52px;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0}
.icobtn.empty{border-style:dashed;color:var(--muted)}
.icogrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:8px}
.icogrid button{aspect-ratio:1;max-width:100%;min-height:44px;border-radius:12px;border:1.5px solid transparent;background:none;color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0}
.icogrid button[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.icogrid .none{font-size:12px;color:var(--muted)}
.up-t{color:var(--up)} .down-t{color:var(--down)}
.seg button.on.up-t{color:var(--up)} .seg button.on.down-t{color:var(--down)}
.sum.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum.three .sum-card{padding:12px 10px}
.sum.three .sum-v{font-size:22px}
button.sum-card{text-align:left;color:var(--fg);cursor:pointer}
.sum-v.amt{font-size:clamp(13px,4.1vw,17px)!important;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-card,.tile{min-width:0}
.tile-v.sm{overflow:hidden;text-overflow:ellipsis}
.eyebtn{height:36px;padding:0 6px;border:0;background:none;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:4px}
.pnl-card{width:100%;box-sizing:border-box;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--fg)}
.pnl-top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.pnl-top>div{min-width:0}
.pnl-l{font-size:12px;color:var(--muted)}
.pnl-v{font-size:clamp(22px,7.5vw,30px);font-weight:900;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pnl-v.sm{font-size:24px}
.pnl-v.faint{color:var(--faint);font-size:22px}
.pnl-v.prompt{color:var(--muted);font-size:16px;font-weight:700}
.pnl-chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;background:var(--chip);display:flex;align-items:center;font-size:14px;font-weight:700}
.pnl-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pe{display:flex;flex-direction:column;min-height:100%}
.pe-body{flex:1 1 auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}
.pe-date{text-align:center;font-size:13px;color:var(--muted)}
.pe-num{text-align:center;font-size:clamp(30px,11vw,44px);font-weight:900;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;padding-top:8px}
.pe-hint{text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.6}
.pe-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ghost{height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.ghost.bad-t{color:var(--bad)}
.keypad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 8px 12px;background:var(--chip)}
.own-host .keypad{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.key{height:52px;border:0;border-radius:10px;background:var(--surface);color:var(--fg);font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.key.alt{background:var(--line)}
.pnl-read{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.chart{display:block;width:100%;height:auto}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tile-v.sm{font-size:16px;white-space:nowrap}
.switch{flex:0 0 auto;width:52px;height:32px;border-radius:16px;border:0;padding:3px;display:flex;justify-content:flex-start;background:var(--faint)}
.switch[aria-checked="true"]{background:var(--good);justify-content:flex-end}
.knob{width:26px;height:26px;border-radius:13px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.searchbar{display:flex;align-items:center;gap:8px}
.searchbar input{flex:1 1 auto;min-width:0}
.res-count{margin-top:4px}
.res-item{width:100%;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;color:var(--fg)}
.list .res-item:last-child{border-bottom:0}
.res-d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.res-t{font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
mark{background:var(--good-soft);color:inherit;font-weight:700;border-radius:3px;padding:0 1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.savecard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.save-top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.save-top>div{min-width:0}
.save-v{font-size:clamp(24px,8vw,30px);font-weight:900;color:var(--good);font-variant-numeric:tabular-nums}
.save-side{font-size:12px;color:var(--muted);text-align:right;line-height:1.6;font-variant-numeric:tabular-nums;flex:0 0 auto}
.save-rows{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.save-row{display:flex;align-items:center;gap:10px;padding-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.save-row .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.save-row .ct{color:var(--muted)}
.save-row .am{min-width:72px;text-align:right;font-weight:700}
.hintcard{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:16px;font-size:14px;color:var(--muted);line-height:1.6;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.linkish{border:0;background:none;color:var(--good);font-weight:700;padding:0;min-height:32px;font-size:14px}
.ready{background:var(--good-soft);border:1.5px solid var(--good-line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.gift{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--good)}
.ready-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.ready-n{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.ready-s{font-size:12px;color:var(--good);line-height:1.5}
.redeem{flex:0 0 auto;height:40px;padding:0 16px;border-radius:20px;border:0;background:var(--good);color:var(--on-good);font-size:15px;font-weight:700}
.goal{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:0;border-bottom:1px solid var(--line-soft);background:none;color:var(--fg)}
.list .goal:last-child{border-bottom:0}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal-n{font-size:16px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.goal-p{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.goal-p.over{color:var(--bad)}
.goal-p.paused{color:var(--muted)}
.goal-r{font-size:12px;color:var(--muted);line-height:1.5}
.gbar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--good)}
.gbar i.over{background:var(--bad)}
.hist-row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line-soft);min-height:52px;box-sizing:border-box}
.list .hist-row:last-child{border-bottom:0}
.hist-d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px}
.hist-n{flex:1 1 auto;min-width:0;font-size:15px;overflow-wrap:anywhere}
.hist-a{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rbanner{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:0;background:var(--good-soft);color:var(--fg);font-size:14px;text-align:left}
.rbanner span{flex:1 1 auto;min-width:0}
.rbanner svg{flex:0 0 auto;color:var(--good)}
.restbar{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line);font-size:13px;color:var(--muted);line-height:1.5}
.restbar.on{border-color:var(--good-line);color:var(--fg)}
.darkbtn{height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:700}
.darkbtn:disabled{background:var(--chip);color:var(--faint);cursor:default}
.rtypes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rtype{min-height:60px;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.rtype b{font-size:15px}
.rtype span{font-size:11px;color:var(--muted)}
.rtype.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.rtype.on span{color:inherit;opacity:.85}
.radio{flex:0 0 auto;width:22px;height:22px;border-radius:11px;border:2px solid var(--faint);box-sizing:border-box}
.radio.on{border:7px solid var(--good)}
.pickrow{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;border:0;border-bottom:1px solid var(--line-soft);background:none;color:var(--fg);font-size:15px;text-align:left}
.list .pickrow:last-child{border-bottom:0}
.pickrow .nm{flex:1 1 auto;min-width:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepbtn{flex:0 0 auto;width:44px;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;color:var(--muted);padding:0}
.stepbtn.dark{border:0;background:var(--ink);color:var(--on-ink)}
.stepval{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px;color:var(--muted)}
.stepval input[type=text]{width:120px;min-width:0;height:auto;border:0;border-radius:0;background:transparent;text-align:center;font-size:24px;font-weight:900;color:var(--fg);font-variant-numeric:tabular-nums;outline:none;padding:0}
.rpreview{background:var(--surface);border:1.5px dashed var(--faint);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.7}
.savebox{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.moneyin{display:flex;align-items:center;gap:8px;height:48px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--bg);color:var(--muted)}
.moneyin input[type=text]{flex:1 1 auto;width:auto;min-width:0;height:auto;border:0;border-radius:0;background:transparent;font-size:20px;font-weight:900;color:var(--fg);outline:none;padding:0;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.toast-act{margin-left:12px;border:0;background:none;color:var(--good-line);font-weight:700;font-size:14px;padding:0;min-height:24px}
.savefrom{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.datein{box-sizing:border-box;width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:16px;color:var(--fg);font-family:inherit;-webkit-appearance:none;appearance:none}
</style>

/* ---------- storage ---------- */
function blank(){return {v:1,habits:[],logs:{},settings:{},rewards:[],redeemed:[]};}
function valid(d){return d&&Array.isArray(d.habits)&&d.logs&&typeof d.logs==='object'&&!Array.isArray(d.logs);}
function normalize(d){
  if(!valid(d))return null;
  var habits=d.habits.filter(function(h){return h&&h.id&&h.name;}).map(function(h){
    return {id:String(h.id),name:String(h.name).slice(0,40),kind:h.kind==='bad'?'bad':'good',
      method:h.method==='count'?'count':'check',
      days:Array.isArray(h.days)&&h.days.length===7?h.days.map(Boolean):allDays(),
      created:/^\d{4}-\d\d-\d\d$/.test(h.created)?h.created:todayKey(),archived:!!h.archived,icon:ICONS[h.icon]?h.icon:(h.icon==='none'?'none':''),saveHist:normHist(h.saveHist)};
  });
  var logs={};
  Object.keys(d.logs).forEach(function(k){
    if(!/^\d{4}-\d\d-\d\d$/.test(k))return;var l=d.logs[k]||{},o={};
    if(l.h&&typeof l.h==='object'){o.h={};Object.keys(l.h).forEach(function(id){var v=Math.floor(+l.h[id]);if(v>0)o.h[id]=v;});if(!Object.keys(o.h).length)delete o.h;}
    if(typeof l.mood==='number'&&l.mood>=0&&l.mood<=4)o.mood=l.mood;
    if(typeof l.note==='string'&&l.note)o.note=l.note;
    if(typeof l.pnl==='number'&&isFinite(l.pnl))o.pnl=Math.round(l.pnl);
    if(l.rest===true)o.rest=true;
    if(Object.keys(o).length)logs[k]=o;
  });
  var st=d.settings||{};
  var rewards=(Array.isArray(d.rewards)?d.rewards:[]).filter(function(r){return r&&r.id&&r.name&&RTYPES[r.type];}).map(function(r){
    return {id:String(r.id),name:String(r.name).slice(0,40),type:r.type,habit:r.habit?String(r.habit):null,target:Math.max(0,Math.round(+r.target)||0),
      repeat:!!r.repeat,created:isKey(r.created)?r.created:todayKey(),earned:(Array.isArray(r.earned)?r.earned:[]).filter(isKey),done:!!r.done};
  });
  var redeemed=(Array.isArray(d.redeemed)?d.redeemed:[]).filter(function(x){return x&&x.id&&isKey(x.date);}).map(function(x){
    return {id:String(x.id),rid:String(x.rid||''),name:String(x.name||'').slice(0,40),date:x.date,amount:Math.max(0,Math.round(+x.amount)||0)};
  });
  return {v:1,habits:habits,logs:logs,settings:{pnl:!!st.pnl,hideAmt:!!st.hideAmt,iconAuto:!!st.iconAuto},rewards:rewards,redeemed:redeemed};
}

/* ---------- data helpers ---------- */
function active(kind){return db.habits.filter(function(h){return !h.archived&&h.kind===kind;});}
function byId(id){for(var i=0;i<db.habits.length;i++)if(db.habits[i].id===id)return db.habits[i];return null;}
function val(k,id){var l=db.logs[k];return (l&&l.h&&l.h[id])||0;}
function tidy(k){var l=db.logs[k];if(!l)return;if(l.h&&!Object.keys(l.h).length)delete l.h;if(!l.note)delete l.note;if(l.mood==null)delete l.mood;if(typeof l.pnl!=='number')delete l.pnl;if(!l.rest)delete l.rest;if(!Object.keys(l).length)delete db.logs[k];}
function setVal(k,id,v){
  var l=db.logs[k]||(db.logs[k]={});l.h=l.h||{};
  if(v>0)l.h[id]=v;else delete l.h[id];
  var h=byId(id);if(h&&v>0&&k<h.created)h.created=k;
  tidy(k);save();
}
function sched(h,k){return h.kind!=='good'||!!h.days[parseKey(k).getDay()];}
function isRest(k){var l=db.logs[k];return !!(l&&l.rest);}
function scheduled(h,k){return sched(h,k)&&!(h.kind==='good'&&isRest(k)&&!(val(k,h.id)>0));}
function goodStreak(h,k){
  var n=0,d=k;if(!(val(d,h.id)>0))d=addDays(d,-1);
  for(var i=0;i<4000&&d>=h.created;i++){if(scheduled(h,d)){if(val(d,h.id)>0)n++;else break;}d=addDays(d,-1);}
  return n;
}
function bestStreak(h,end){
  var best=0,run=0,d=h.created;
  for(var i=0;i<4000&&d<=end;i++){if(scheduled(h,d)){if(val(d,h.id)>0){run++;if(run>best)best=run;}else run=0;}d=addDays(d,1);}
  return best;
}
function cleanDays(h,k){
  var d=addDays(k,-1);
  for(var i=0;i<4000&&d>=h.created;i++){if(val(d,h.id)>0)return diffDays(k,d);d=addDays(d,-1);}
  return Math.max(1,diffDays(k,h.created)+1);
}
function removeHabit(id){
  db.habits=db.habits.filter(function(h){return h.id!==id;});
  db.rewards=db.rewards.filter(function(r){return r.habit!==id;});
  Object.keys(db.logs).forEach(function(k){var l=db.logs[k];if(l.h)delete l.h[id];tidy(k);});
  save();
}
function addExamples(){

   ['滑手機超過 1 小時','bad','count',allDays()],['吃宵夜','bad','count',allDays()],['喝含糖飲料','bad','count',allDays()]
  ].forEach(function(x){db.habits.push({id:uid(),name:x[0],kind:x[1],method:x[2],days:x[3],created:t,archived:false,icon:guessIcon(x[0])});});
  save();

/* ---------- savings ---------- */
function amtOn(h,k){var a=0;(h.saveHist||[]).forEach(function(e){if(e.from<=k)a=e.amt;});return a;}
function setSave(h,amt,from){
  var t=todayKey();amt=Math.max(0,Math.round(+amt)||0);
  var first=!(h.saveHist||[]).some(function(e){return e.amt>0&&e.from<t;});
  if(first&&amt>0&&isKey(from)&&from<t){h.saveHist=[{from:from,amt:amt}];return;}
  if(amtOn(h,t)===amt)return;
  h.saveHist=h.saveHist||[];var last=h.saveHist[h.saveHist.length-1];
  if(last&&last.from===t)last.amt=amt;else h.saveHist.push({from:t,amt:amt});
}
function savedFor(h,k){
  var a=amtOn(h,k);if(!a)return 0;var v=val(k,h.id);
  if(h.kind==='good')return h.method==='count'?v*a:(v>0?a:0);
  return (db.logs[k]&&!(v>0))?a:0;
}
function savingsTotals(){
  var t=todayKey(),ms=t.slice(0,8)+'01',all=0,mon=0,per={},from=null;
  db.habits.forEach(function(h){(h.saveHist||[]).forEach(function(e){if(e.amt>0&&(!from||e.from<from))from=e.from;});});
  Object.keys(db.logs).forEach(function(k){
    if(k>t)return;
    db.habits.forEach(function(h){
      var v=savedFor(h,k);if(!v)return;all+=v;
      if(k>=ms){mon+=v;var p=per[h.id]||(per[h.id]={h:h,n:0,amt:0});p.n+=Math.max(1,Math.round(v/amtOn(h,k)));p.amt+=v;}
    });
  });
  var spent=db.redeemed.reduce(function(a,x){return a+(x.amount||0);},0);
  return {all:all,mon:mon,per:per,spent:spent,avail:all-spent,from:from};
}
function anySave(){return db.habits.some(function(h){return (h.saveHist||[]).some(function(e){return e.amt>0;});});}

/* ---------- rest cards ---------- */
var REST_PER_MONTH=2;
function restUsed(k){var ms=k.slice(0,8)+'01',me=monthEndKey(k);return Object.keys(db.logs).filter(function(x){return x>=ms&&x<=me&&db.logs[x].rest;}).length;}
function restUI(k){
  var t=todayKey();if(k>=t||diffDays(t,k)>7)return '';
  var mo=(parseKey(k).getMonth()+1)+'月';
  if(isRest(k))return '<div class="restbar on"><span>這天用了休息卡，沒做到的好習慣不會中斷連續，也不算進完成率。</span><button class="ghost" data-act="unrest">取消休息</button></div>';
  var missed=active('good').filter(function(h){return sched(h,k)&&k>=h.created&&!(val(k,h.id)>0);});
  if(!missed.length)return '';
  var left=REST_PER_MONTH-restUsed(k);
  return '<div class="restbar"><span>這天沒做到 '+missed.length+' 項。生病或有事的話，可以用休息卡補這一天。</span>'+
    '<button class="darkbtn" data-act="userest"'+(left>0?'':' disabled')+'>'+(left>0?'用休息卡（'+mo+'剩 '+left+' 張）':mo+'的休息卡用完了')+'</button></div>';
}

/* ---------- rewards ---------- */
function monthEndKey(k){var d=parseKey(k);return keyOf(new Date(d.getFullYear(),d.getMonth()+1,0));}
function nextMonthKey(k){var d=parseKey(k);return keyOf(new Date(d.getFullYear(),d.getMonth()+1,1));}
function weekStartKey(k){var d=parseKey(k);return addDays(k,-((d.getDay()+6)%7));}
function maxK(){var a=[].slice.call(arguments).filter(Boolean).sort();return a[a.length-1];}
function rById(id){for(var i=0;i<db.rewards.length;i++)if(db.rewards[i].id===id)return db.rewards[i];return null;}
function streakSince(h,end,since){
  var n=0,last=null,d=end;if(!(val(d,h.id)>0))d=addDays(d,-1);
  for(var i=0;i<4000&&d>=h.created&&(!since||d>since);i++){
    if(scheduled(h,d)){if(val(d,h.id)>0){n++;if(!last)last=d;}else break;}
    d=addDays(d,-1);
  }
  return {n:n,last:last};
}
function weekCount(h,w,from,t){var c=0;for(var i=0;i<7;i++){var d=addDays(w,i);if(d>=from&&d>=h.created&&d<=t&&val(d,h.id)>0)c++;}return c;}
function monthResult(r,h,m,to){
  var from=maxK(m,r.created,h.created),sc=0,dn=0,slips=0;
  for(var d=from;d<=to;d=addDays(d,1)){
    if(r.type==='rate'){if(scheduled(h,d)){sc++;if(val(d,h.id)>0)dn++;}}
    else slips+=val(d,h.id);
  }
  return r.type==='rate'?{rate:sc?Math.round(dn/sc*100):0,sc:sc}:{slips:slips};
}
function syncRewards(){
  var t=todayKey(),changed=false;
  db.rewards.forEach(function(r){
    if(r.done||r.type==='saved')return;
    var h=byId(r.habit);if(!h||h.archived)return;
    if(!r.repeat&&r.earned.length)return;
    if(r.type==='streak'){
      var st=streakSince(h,t,r.earned.length?r.earned[r.earned.length-1]:null);
      if(st.n>=r.target&&st.last){r.earned.push(st.last);changed=true;}
    }else if(r.type==='weekly'){
      for(var w=weekStartKey(r.created);w<=t;w=addDays(w,7)){
        if(r.earned.indexOf(w)>=0)continue;
        if(weekCount(h,w,r.created,t)>=r.target){r.earned.push(w);changed=true;if(!r.repeat)break;}
      }
    }else{
      for(var m=r.created.slice(0,8)+'01';monthEndKey(m)<t;m=nextMonthKey(m)){
        if(r.earned.indexOf(m)>=0)continue;
        var res=monthResult(r,h,m,monthEndKey(m));
        var ok=r.type==='rate'?(res.sc>0&&res.rate>=r.target):res.slips<=r.target;
        if(ok){r.earned.push(m);changed=true;if(!r.repeat)break;}
      }
    }
  });
  if(changed)save();
}
function redCount(rid){return db.redeemed.filter(function(x){return x.rid===rid;}).length;}
function pending(r,tot){
  if(r.done)return 0;
  if(r.type==='saved')return r.target>0&&tot.avail>=r.target?1:0;
  var h=byId(r.habit);if(!h||h.archived)return 0;
  return Math.max(0,r.earned.length-redCount(r.id));
}
function pctOf(a,b){return b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):0;}
function ruleText(r,h,ml){
  var hn=h?'「'+esc(h.name)+'」':'「（已刪除的習慣）」',t=r.target,mm=ml||'這個月';
  return {streak:hn+'連續做到 '+t+' 天',weekly:'一週內'+hn+'做到 '+t+' 天',rate:mm+hn+'完成率達到 '+t+'%',
    limit:mm+hn+'最多犯 '+t+' 次',saved:'省下的錢累計到 NT$'+fmtN(t)}[r.type];
}
function progressOf(r,h,tot){
  var t=todayKey(),me=monthEndKey(t),settle=shortMD(me)+' 結算';
  if(r.type==='saved')return {txt:'NT$'+fmtN(Math.max(0,tot.avail))+' / '+fmtN(r.target),pct:pctOf(tot.avail,r.target)};
  if(!h)return {txt:'',pct:0};
  if(h.archived)return {txt:'暫停中',pct:0,cls:'paused',note:'習慣已封存，恢復後會繼續計算。'};
  if(r.type==='streak'){var n=streakSince(h,t,r.earned.length?r.earned[r.earned.length-1]:null).n;return {txt:n+' / '+r.target+' 天',pct:pctOf(n,r.target)};}
  if(r.type==='weekly'&&r.earned.indexOf(weekStartKey(t))>=0)return {txt:'本週已達成',pct:100,note:r.repeat?'下週重來':''};
  if(r.type==='weekly'){var c=weekCount(h,weekStartKey(t),r.created,t);return {txt:'本週 '+c+' / '+r.target+' 天',pct:pctOf(c,r.target)};}
  var m=t.slice(0,8)+'01';
  if(r.created>me)return {txt:'',pct:0};
  var res=monthResult(r,h,m,t);
  if(r.type==='rate')return {txt:'目前 '+res.rate+'%',pct:pctOf(res.rate,r.target),note:settle};
  var over=res.slips>r.target;
  return {txt:over?'已超過 '+(res.slips-r.target)+' 次':'剩 '+(r.target-res.slips)+' 次額度',pct:r.target?pctOf(res.slips,r.target):(res.slips?100:0),cls:over?'over':'',
    note:'目前犯了 '+res.slips+' 次 · '+(over?(r.repeat?'這個月沒達成，下個月重來':'這次沒達成'):settle)};
}
function rewardBanner(){

function removeRedemption(id){

  if(anySave()||tot.all){
    var rows=Object.keys(tot.per).map(function(id){return tot.per[id];}).sort(function(a,b){return b.amt-a.amt;});
    s+='<section class="savecard"><div class="save-top"><div><div class="pnl-l">本月省下</div><div class="save-v">NT$'+fmtN(tot.mon)+'</div></div>'+
      '<div class="save-side">累計 NT$'+fmtN(tot.all)+'<br>可用 NT$'+fmtN(tot.avail)+'</div></div>';
    if(rows.length)s+='<div class="save-rows">'+rows.map(function(p){
      return '<div class="save-row"><span class="nm">'+esc(p.h.name)+'</span><span class="ct">'+p.n+(p.h.kind==='bad'?' 天':' 次')+'</span><span class="am">NT$'+fmtN(p.amt)+'</span></div>';
    }).join('')+'</div>';
    else s+='<p class="small muted">這個月還沒有累計。'+(tot.from?'從 '+shortMD(tot.from)+' 開始計算。':'')+'</p>';
    if(tot.spent)s+='<p class="small muted">已用在獎勵 NT$'+fmtN(tot.spent)+'。</p>';
    s+='</section>';
  }else{
    s+='<div class="hintcard"><span>幫習慣設定「省下的錢」，例如沒買咖啡省 NT$80，這裡會開始累計，也能當成獎勵條件。</span><button class="linkish" data-act="tab" data-tab="settings">到習慣設定</button></div>';
  }
  var ready=[],prog=[];
  db.rewards.forEach(function(r){
    if(r.done)return;var h=r.habit?byId(r.habit):null;
    var p=pending(r,tot);if(p>0)ready.push({r:r,h:h,p:p});else prog.push({r:r,h:h});

var MASK='••••••';
function hasP(k){var l=db.logs[k];return !!l&&typeof l.pnl==='number';}
function pnlKeys(){return Object.keys(db.logs).filter(hasP).sort();}
function pnlAt(k){return db.logs[k].pnl;}
function prevPnlKey(k){var ks=pnlKeys(),r=null;for(var i=0;i<ks.length&&ks[i]<k;i++)r=ks[i];return r;}
function fmtN(v){return Math.abs(v).toLocaleString('en-US');}
function cmpN(v){var a=Math.abs(v);if(a<1e5)return a.toLocaleString('en-US');if(a<1e7)return (Math.round(a/1e3)/10).toLocaleString('en-US')+'萬';if(a<1e8)return Math.round(a/1e4).toLocaleString('en-US')+'萬';return (Math.round(a/1e6)/100)+'億';}
function cchg(v){return (v>0?'▲':v<0?'▼':'')+cmpN(v);}
function csgn(v){return (v>0?'+':v<0?'−':'')+cmpN(v);}
function sgn(v){return (v>0?'+':v<0?'−':'')+fmtN(v);}
function chg(v){return (v>0?'▲ ':v<0?'▼ ':'')+fmtN(v);}
function pcls(v){return v>0?'up-t':v<0?'down-t':'';}
function hid(){return !!db.settings.hideAmt;}
function shortMD(k){var d=parseKey(k);return (d.getMonth()+1)+'/'+d.getDate();}
function monthChange(y,m,endKey){
  var start=keyOf(new Date(y,m,1)),end=keyOf(new Date(y,m+1,0));if(endKey&&end>endKey)end=endKey;
  var ks=pnlKeys().filter(function(k){return k>=start&&k<=end;});
  if(!ks.length)return null;
  var bk=prevPnlKey(start),base=bk?pnlAt(bk):pnlAt(ks[0]);
  return {keys:ks,baseKey:bk,base:base,change:pnlAt(ks[ks.length-1])-base,show:!!bk||ks.length>1};
}

function pnlStats(y,m){
  var t=todayKey(),h=hid(),end=keyOf(new Date(y,m+1,0));if(end>t)end=t;
  var now=new Date(),isCur=y===now.getFullYear()&&m===now.getMonth();

  if(!mc)return '<div class="empty"><div class="empty-t">這個月沒有紀錄</div><p>每天收盤後記下帳面上的未實現損益，這裡會畫出走勢。</p>'+
    (isCur?'<button class="primary" data-act="pnlopen" data-k="'+t+'">輸入今天的數字</button>':'')+'</div>';
  var ks=mc.keys,vals=ks.map(pnlAt),sel=ks.indexOf(ui.pnlSel);if(sel<0)sel=ks.length-1;
  var sk=ks[sel],sv=vals[sel],pk=prevPnlKey(sk),sd=pk!=null?sv-pnlAt(pk):null,ds=parseKey(sk);
  var W=320,H=170,L=10,R=10,T=16,B=12;
  var all=vals.slice();if(mc.baseKey)all.push(mc.base);
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pad=(hi-lo)*0.12||Math.max(1,Math.abs(hi)*0.05);lo-=pad;hi+=pad;
  function X(i){return ks.length===1?W/2:L+i*(W-L-R)/(ks.length-1);}
  function Y(v){return T+(hi-v)/(hi-lo)*(H-T-B);}
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(m+1)+'月未實現損益走勢，共 '+ks.length+' 筆紀錄">';
  if(lo<0&&hi>0)svg+='<line x1="0" x2="'+W+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(W-2)+'" y="'+(Y(0)-4).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--faint)">0</text>';
  if(mc.baseKey)svg+='<line x1="0" x2="'+W+'" y1="'+Y(mc.base).toFixed(1)+'" y2="'+Y(mc.base).toFixed(1)+'" style="stroke:var(--faint)" stroke-width="1" stroke-dasharray="4 4"/>'+
    '<text x="'+(W-2)+'" y="'+(Y(mc.base)-4).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--muted)">上月底'+(h?'':' '+sgn(mc.base))+'</text>';
  if(ks.length>1)svg+='<path d="'+ks.map(function(_,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1);}).join(' ')+'" fill="none" style="stroke:var(--fg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  ks.forEach(function(k,i){
    var p=i?vals[i]-vals[i-1]:(mc.baseKey?vals[0]-mc.base:0),col=p>0?'var(--up)':p<0?'var(--down)':'var(--faint)';
    svg+='<g data-act="pnlpt" data-k="'+k+'" style="cursor:pointer"><circle cx="'+X(i).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+'" r="14" fill="transparent"/>'+
      '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+'" r="'+(i===sel?6:4)+'" style="fill:'+col+';stroke:var(--surface)" stroke-width="2"/></g>';
  });

  var hiV=Math.max.apply(null,vals),loV=Math.min.apply(null,vals);

    svg+'<div class="chart-x"><span>'+shortMD(ks[0])+'</span>'+(ks.length>1?'<span>'+shortMD(ks[ks.length-1])+'</span>':'')+'</div>'+
    '<p class="small muted">只畫有記錄的日子，點圓點看那一天。</p></div>';
  s+='<div class="tiles">'+
    '<div class="tile"><div class="tile-l">本月變動</div><div class="tile-v sm '+(h||!mc.show?'':pcls(mc.change))+'">'+(!mc.show?'—':h?'••••':cchg(mc.change))+'</div></div>'+
    '<div class="tile"><div class="tile-l">本月最高</div><div class="tile-v sm">'+(h?'••••':csgn(hiV))+'</div></div>'+
    '<div class="tile"><div class="tile-l">本月最低</div><div class="tile-v sm">'+(h?'••••':csgn(loV))+'</div></div></div>';
  return s;

/* ---------- search ---------- */
function snip(text,terms){
  if(text.length<=140)return text;
  var i=terms.length?text.toLowerCase().indexOf(terms[0]):0;if(i<0)i=0;
  var st=Math.max(0,i-40);
  return (st>0?'…':'')+text.slice(st,st+140)+(st+140<text.length?'…':'');
}
function highlight(text,terms){
  if(!terms.length)return esc(text);
  var low=text.toLowerCase(),out='',i=0;
  while(i<text.length){
    var best=-1,len=0;
    terms.forEach(function(t){var j=low.indexOf(t,i);if(j>=0&&(best<0||j<best||(j===best&&t.length>len))){best=j;len=t.length;}});
    if(best<0){out+=esc(text.slice(i));break;}
    out+=esc(text.slice(i,best))+'<mark>'+esc(text.slice(best,best+len))+'</mark>';i=best+len;
  }
  return out;
}
function searchResults(){
  var raw=(ui.q||'').trim(),terms=raw?raw.toLowerCase().split(/\s+/):[];
  var ks=Object.keys(db.logs).filter(function(k){return !!db.logs[k].note;}).sort().reverse();

  var hits=ks.filter(function(k){var n=db.logs[k].note.toLowerCase();return terms.every(function(t){return n.indexOf(t)>=0;});});
  var head=raw?(hits.length?'找到 '+hits.length+' 天':'找不到「'+esc(raw)+'」'):'全部備註 · '+ks.length+' 天';
  var s='<p class="small muted res-count">'+head+'</p>';

  }).join('')+'</div>';

}

/* ---------- views ---------- */
function dateLabel(k){var t=todayKey();if(k===t)return '今天';if(k===addDays(t,-1))return '昨天';var d=parseKey(k);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function dateSub(k){var d=parseKey(k);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 週'+WD[d.getDay()];}

function counter(id,v,kind){
  return '<div class="counter"><button class="minus" data-act="dec" data-id="'+id+'" aria-label="減一次"'+(v?'':' disabled')+'>'+I.minus+'</button>'+
    '<span class="cnt '+(v?kind+'-t':'zero')+'">'+v+'</span>'+
    '<button class="plus '+kind+'" data-act="inc" data-id="'+id+'" aria-label="加一次">'+I.plus+'</button></div>';
}
function goodCard(h,k){
  var v=val(k,h.id),on=v>0,st=goodStreak(h,k);

  var svd=savedFor(h,k);if(svd)sub+=' · 省下 NT$'+fmtN(svd);
  if(h.method==='count'){
    return '<div class="hcard'+(on?' g-on':'')+'"><div class="hc-lead">'+cardIco(h)+'<div class="hc-text"><div class="hc-name">'+esc(h.name)+'</div><div class="hc-sub'+(on?' good-t':'')+'">'+sub+'</div></div></div>'+counter(h.id,v,'good')+'</div>';
  }

}
function badCard(h,k){
  var v=val(k,h.id),on=v>0;
  var sub=on?(h.method==='count'?'今天犯了 '+v+' 次':'今天有犯'):'已 '+cleanDays(h,k)+' 天沒犯';
  var svd=savedFor(h,k);if(svd)sub+=' · 省下 NT$'+fmtN(svd);
  if(h.method==='check'){
    return '<button class="hcard'+(on?' b-on':'')+'" data-act="toggle" data-id="'+h.id+'" aria-pressed="'+on+'"><div class="hc-lead">'+cardIco(h)+'<div class="hc-text"><div class="hc-name">'+esc(h.name)+'</div><div class="hc-sub">'+sub+'</div></div></div><span class="check bad'+(on?' on':'')+'" aria-hidden="true">'+(on?I.x:'')+'</span></button>';
  }
  return '<div class="hcard'+(on?' b-on':'')+'"><div class="hc-lead">'+cardIco(h)+'<div class="hc-text"><div class="hc-name">'+esc(h.name)+'</div><div class="hc-sub">'+sub+'</div></div></div>'+counter(h.id,v,'bad')+'</div>';
}

     '<div class="sum-card"><div class="sum-l muted">壞習慣</div><div class="sum-v bad-t">'+badSum+'<small class="muted"> 次</small></div></div>'+(pOn?pnlTile(k):'')+'</div>';
  if(goods.length){

  }

  if(pOn)s+=pnlSection(k);

    '</div><label for="note" class="lbl">備註</label><textarea id="note" rows="3" placeholder="今天發生了什麼？">'+esc(log.note||'')+'</textarea></section>';

function vStats(){
  var t=todayKey(),now=new Date();
  if(!ui.month)ui.month=[now.getFullYear(),now.getMonth()];
  var y=ui.month[0],m=ui.month[1];
  var first=new Date(y,m,1),lastDay=new Date(y,m+1,0).getDate();
  var isCur=y===now.getFullYear()&&m===now.getMonth();
  var goods=active('good'),bads=active('bad');
  var pOn=!!db.settings.pnl,tab=pOn?ui.statTab:'habits';
  var s='<div class="page"><header class="titlebar"><h1 class="h1">統計</h1><button class="iconbtn" data-act="search" aria-label="搜尋備註">'+I.search+'</button></header>';
  if(pOn)s+='<div class="seg"><button class="'+(tab==='habits'?'on':'')+'" data-act="stab" data-v="habits" aria-pressed="'+(tab==='habits')+'">習慣</button>'+
    '<button class="'+(tab==='pnl'?'on':'')+'" data-act="stab" data-v="pnl" aria-pressed="'+(tab==='pnl')+'">未實現損益</button></div>';
  s+='<div class="monthnav" style="justify-content:center"><button class="iconbtn" data-act="month" data-n="-1" aria-label="上個月">'+I.left+'</button>'+
    '<div class="month-l">'+y+' 年 '+(m+1)+' 月</div>'+
    '<button class="iconbtn" data-act="month" data-n="1" aria-label="下個月"'+(isCur||first>now?' disabled':'')+'>'+I.right+'</button></div>';
  if(tab==='pnl')return s+pnlStats(y,m)+'</div>';
  if(!goods.length&&!bads.length){
    return s+'<div class="empty"><div class="empty-t">還沒有資料</div><p>先到「習慣設定」新增習慣，記錄幾天後這裡就會出現月曆和趨勢。</p><button class="primary" data-act="new">新增習慣</button></div></div>';
  }
  var S=0,D=0,B=0,cells=[];
  for(var b=0;b<first.getDay();b++)cells.push('<span class="cell blank"></span>');
  for(var d=1;d<=lastDay;d++){
    var k=keyOf(new Date(y,m,d));
    if(k>t){cells.push('<span class="cell future">'+d+'</span>');continue;}
    var sc=0,dn=0;
    goods.forEach(function(h){if(k>=h.created&&scheduled(h,k)){sc++;if(val(k,h.id)>0)dn++;}});
    var bb=bads.reduce(function(a,h){return a+val(k,h.id);},0);
    S+=sc;D+=dn;B+=bb;
    var r=sc?dn/sc:0,lv=(!sc||!dn)?0:(r>=1?3:(r>=0.5?2:1));
    cells.push('<button class="cell'+(lv?' l'+lv:'')+(k===t?' today':'')+'" data-act="pickday" data-k="'+k+'" aria-label="'+(m+1)+'月'+d+'日，好習慣 '+dn+'/'+sc+(bb?'，壞習慣 '+bb+' 次':'')+'">'+d+(bb?'<i class="dot"></i>':'')+'</button>');
  }
  s+='<div class="panel"><div class="heat">'+WD.map(function(w){return '<div class="wd">'+w+'</div>';}).join('')+'</div><div class="heat">'+cells.join('')+'</div>'+
    '<div class="legend"><span>少 <i class="sw" style="background:var(--chip)"></i><i class="sw" style="background:var(--h1)"></i><i class="sw" style="background:var(--h2)"></i><i class="sw" style="background:var(--good)"></i> 多</span><span><i class="sw" style="width:6px;height:6px;border-radius:3px;background:var(--bad)"></i> 有壞習慣</span></div>'+
    '<p class="small muted">點日期可以回去補記那一天。</p></div>';
  var best=goods.reduce(function(a,h){return Math.max(a,bestStreak(h,t));},0);
  s+='<div class="tiles"><div class="tile"><div class="tile-l">本月完成率</div><div class="tile-v good-t">'+(S?Math.round(D/S*100)+'%':'—')+'</div></div>'+
    '<div class="tile"><div class="tile-l">最長連續</div><div class="tile-v">'+best+' 天</div></div>'+
    '<div class="tile"><div class="tile-l">本月壞習慣</div><div class="tile-v bad-t">'+B+' 次</div></div></div>';
  var start=keyOf(first),end=keyOf(new Date(y,m,lastDay));if(end>t)end=t;
  var rows=[],badMax=0,badRows=[];
  goods.forEach(function(h){
    var sc=0,dn=0;
    if(start<=t){for(var dd=start>h.created?start:h.created;dd<=end;dd=addDays(dd,1)){if(scheduled(h,dd)){sc++;if(val(dd,h.id)>0)dn++;}}}
    var pct=sc?Math.round(dn/sc*100):0;
    rows.push({name:h.name,v:sc?pct+'%':'—',w:pct,c:'var(--good)',cls:'good-t'});
  });
  bads.forEach(function(h){
    var n=0;if(start<=t){for(var dd=start;dd<=end;dd=addDays(dd,1))n+=val(dd,h.id);}
    if(n>badMax)badMax=n;badRows.push({name:h.name,n:n});
  });
  badRows.forEach(function(r){rows.push({name:r.name,v:r.n+' 次',w:badMax?Math.round(r.n/badMax*100):0,c:'var(--bad)',cls:'bad-t'});});
  s+='<section class="sec"><h2 class="sec-t">各習慣本月</h2>'+rows.map(function(r){
    return '<div class="barcard"><div class="bar-top"><div class="bar-name">'+esc(r.name)+'</div><div class="bar-v '+r.cls+'">'+r.v+'</div></div><div class="track"><div class="fill" style="width:'+r.w+'%;background:'+r.c+'"></div></div></div>';
  }).join('')+'<p class="small muted">好習慣是排定日子的完成比例；壞習慣是本月總次數，最多的那個填滿整條。</p></section>';
  return s+'</div>';
}

  var h='';
  if(sh.type==='export'){
    h='<h2>匯出備份</h2><p>把備份內容複製起來，貼到「備忘錄」或存成檔案。之後在「從備份還原」貼回來就能復原。</p>'+
      '<div class="stack"><button class="primary" data-act="copy">複製備份內容</button>'+(document.documentElement.classList.contains('own-host')?'<button class="secondary" data-act="download">下載成檔案</button>':'')+'</div>'+
      '<label class="lbl" for="exporttext">備份內容</label><textarea id="exporttext" class="code" rows="5" readonly>'+esc(sh.text)+'</textarea>';
  }else if(sh.type==='import'){
    h='<h2>從備份還原</h2><div class="stack"><button class="primary" data-act="pickfile">選擇備份檔案</button></div>'+
      '<label class="lbl" for="pastebox">或貼上備份內容</label><textarea id="pastebox" class="code" rows="5" placeholder="貼上匯出的備份內容">'+esc(sh.paste||'')+'</textarea>'+
      (sh.err?'<p class="err0" role="alert">'+sh.err+'</p>':'')+
      '<button class="secondary" data-act="usepaste">使用貼上的內容</button>';
  }else if(sh.type==='confirm'){
    h='<h2>確定要還原嗎？</h2><p>備份裡有 '+sh.data.habits.length+' 個習慣、'+Object.keys(sh.data.logs).length+' 天的紀錄。還原後會取代這支手機上目前的所有資料。</p>'+
      '<div class="stack"><button class="primary danger" data-act="confirmimport">取代目前資料</button></div>';
  }
  h+='<button class="secondary" data-act="closesheet">取消</button>';
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+h+'</div>';
  el.hidden=false;
}
var toastT;
function toast(msg,ms,actHtml){var el=$('#toast');el.innerHTML=esc(msg)+(actHtml||'');el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},ms||1800);}

/* ---------- render ---------- */
function render(){
  var main=$('#main'),v=ui.view;
  main.innerHTML=v==='today'?vToday():v==='stats'?vStats():v==='settings'?vSettings():v==='edit'?vEdit():v==='pnl'?vPnl():v==='search'?vSearch():v==='rewards'?vRewards():v==='redit'?vRewardEdit():vArchived();
  $('#tabs').hidden=v==='edit'||v==='pnl'||v==='redit';
  var tabv=v==='archived'?'settings':v==='search'?'stats':v==='redit'?'rewards':v;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){var on=t.dataset.tab===tabv;t.classList.toggle('on',on);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
  renderSheet();
  if(ui.top){main.scrollTop=0;ui.top=false;}
}
function go(view){ui.view=view;ui.top=true;ui.confirmDel=false;}

function saveDraft(){
  var d=ui.draft,name=(d.name||'').trim();
  if(!name){ui.err='請輸入習慣名稱。';render();return;}
  if(d.kind==='good'&&!d.days.some(Boolean)){ui.err='請至少選一天。';render();return;}
  if(d.id){var h=byId(d.id);if(h){h.name=name;h.kind=d.kind;h.method=d.method;h.days=d.kind==='good'?d.days.slice():allDays();h.icon=d.icon||'';setSave(h,d.save||0,d.firstSave?d.saveFrom:null);}}
  else{var nh={id:uid(),name:name,kind:d.kind,method:d.method,days:d.kind==='good'?d.days.slice():allDays(),created:todayKey(),archived:false,icon:d.icon||'',saveHist:[]};db.habits.push(nh);setSave(nh,d.save||0,d.firstSave?d.saveFrom:null);}
  save();go(ui.back||'settings');render();toast('已儲存');
}

function doExport(){
  var text=JSON.stringify(db),name='habits-backup-'+todayKey()+'.json';
  try{
    var f=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f]}).then(function(){toast('已匯出');}).catch(function(e){
        if(e&&e.name==='AbortError')return;ui.sheet={type:'export',text:text,name:name};render();
      });
      return;
    }
  }catch(e){}
  ui.sheet={type:'export',text:text,name:name};render();
}
function copyText(text){
  function fallback(){var ta=$('#exporttext');if(ta){ta.focus();ta.select();}toast('已選取內容，請按「拷貝」');}
  try{navigator.clipboard.writeText(text).then(function(){toast('已複製，可以貼到備忘錄');},fallback);}catch(e){fallback();}
}
function downloadText(text,name){
  try{var url=URL.createObjectURL(new Blob([text],{type:'application/json'}));var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);}catch(e){}
  toast('如果沒有開始下載，請改用「複製備份內容」');
}
function tryImport(text){
  var d=null;try{d=normalize(JSON.parse(text));}catch(e){}
  if(!d){ui.sheet={type:'import',paste:text,err:'讀不懂這份內容，請確認是從這個 App 匯出的備份。'};render();return;}
  ui.sheet={type:'confirm',data:d};render();
}

/* ---------- events ---------- */
function act(a,b){
  var t=todayKey(),id=b.dataset.id,n,k,h,l;
  switch(a){
    case 'tab': go(b.dataset.tab);if(ui.view==='today'&&ui.follow)ui.date=t;break;
    case 'day': k=addDays(ui.date,+b.dataset.n);if(k>t)return;ui.date=k;ui.follow=k===t;break;
    case 'gotoday': ui.date=t;ui.follow=true;break;
    case 'toggle': setVal(ui.date,id,val(ui.date,id)>0?0:1);break;
    case 'inc': setVal(ui.date,id,val(ui.date,id)+1);break;
    case 'dec': setVal(ui.date,id,Math.max(0,val(ui.date,id)-1));break;
    case 'mood': n=+b.dataset.i;l=db.logs[ui.date]||(db.logs[ui.date]={});l.mood=l.mood===n?null:n;tidy(ui.date);save();break;
    case 'month': n=ui.month[1]+(+b.dataset.n);ui.month=[ui.month[0]+(n<0?-1:n>11?1:0),(n+12)%12];break;
    case 'pickday': ui.date=b.dataset.k;ui.follow=ui.date===t;go('today');break;
    case 'examples': addExamples();toast('已加入 7 個範例習慣，可到「習慣設定」修改');break;
    case 'new': ui.back=ui.view==='edit'?'settings':ui.view;ui.draft={id:null,name:'',kind:b.dataset.kind||'good',method:b.dataset.kind==='bad'?'count':'check',days:allDays(),icon:'flag',iconTouched:false,save:0,firstSave:true,saveFrom:todayKey()};ui.pickIcon=true;ui.err='';go('edit');break;
    case 'edit': h=byId(id);if(!h)return;ui.back='settings';ui.draft={id:h.id,name:h.name,kind:h.kind,method:h.method,days:h.days.slice(),icon:h.icon||'',iconTouched:true,save:amtOn(h,todayKey()),firstSave:!(h.saveHist||[]).some(function(e){return e.amt>0&&e.from<todayKey();}),saveFrom:todayKey(),created:h.created};ui.pickIcon=false;ui.err='';go('edit');break;
    case 'kind': ui.draft.kind=b.dataset.v;ui.draft.method=b.dataset.v==='good'?'check':'count';ui.err='';break;
    case 'iconpick': ui.pickIcon=!ui.pickIcon;break;
    case 'seticon': ui.draft.icon=b.dataset.v;ui.draft.iconTouched=true;ui.pickIcon=false;break;
    case 'method': ui.draft.method=b.dataset.v;break;
    case 'dayt': n=+b.dataset.i;ui.draft.days[n]=!ui.draft.days[n];ui.err='';break;
    case 'cancel': go(ui.back||'settings');break;
    case 'save': saveDraft();return;
    case 'archive': h=byId(ui.draft.id);if(h){h.archived=true;save();}go('settings');toast('已封存');break;
    case 'delete': if(!ui.confirmDel){ui.confirmDel=true;break;}removeHabit(ui.draft.id);go('settings');toast('已刪除');break;
    case 'archived': go('archived');break;
    case 'back': go('settings');break;
    case 'restore': h=byId(id);if(h){h.archived=false;save();}ui.confirmDel=false;toast('已恢復');break;
    case 'delarch': if(ui.confirmDel!==id){ui.confirmDel=id;break;}removeHabit(id);ui.confirmDel=false;toast('已刪除');break;
    case 'hideamt': db.settings.hideAmt=!db.settings.hideAmt;save();break;
    case 'pnltoggle': db.settings.pnl=!db.settings.pnl;if(!db.settings.pnl)ui.statTab='habits';save();toast(db.settings.pnl?'已開啟未實現損益':'已關閉，資料仍保留');break;
    case 'pnlopen': if(b.dataset.k){ui.date=b.dataset.k;ui.follow=ui.date===t;}
      ui.peBack=ui.view;ui.pe=hasP(ui.date)?{digits:String(Math.abs(pnlAt(ui.date))),neg:pnlAt(ui.date)<0}:{digits:'',neg:false};go('pnl');break;
    case 'pkey': n=b.dataset.k;
      if(n==='del')ui.pe.digits=ui.pe.digits.slice(0,-1);
      else{var nd=(ui.pe.digits+n).replace(/^0+/,'');if(nd.length<=12)ui.pe.digits=nd;}
      break;
    case 'psign': ui.pe.neg=b.dataset.v==='1';break;
    case 'plast': k=prevPnlKey(ui.date);if(k){ui.pe={digits:String(Math.abs(pnlAt(k))),neg:pnlAt(k)<0};}break;
    case 'psave': l=db.logs[ui.date]||(db.logs[ui.date]={});l.pnl=(parseInt(ui.pe.digits||'0',10)*(ui.pe.neg?-1:1))||0;save();ui.pnlSel=ui.date;go(ui.peBack||'today');toast(storageOK?'已記錄':'無法儲存');break;
    case 'pclear': l=db.logs[ui.date];if(l){delete l.pnl;tidy(ui.date);save();}go(ui.peBack||'today');toast('已刪除這天的損益紀錄');break;
    case 'pcancel': go(ui.peBack||'today');break;
    case 'pnlpt': ui.pnlSel=b.dataset.k;break;
    case 'stab': ui.statTab=b.dataset.v;break;
    case 'search': go('search');render();var qi=$('#q');if(qi)qi.focus();return;
    case 'sback': go('stats');break;
    case 'userest': if(ui.date>=t||diffDays(t,ui.date)>7||restUsed(ui.date)>=REST_PER_MONTH)return;l=db.logs[ui.date]||(db.logs[ui.date]={});l.rest=true;save();toast('已用休息卡');break;
    case 'unrest': l=db.logs[ui.date];if(l){delete l.rest;tidy(ui.date);save();}toast('已取消，休息卡退回');break;
    case 'savefrom': if(ui.draft&&isKey(b.dataset.v)&&b.dataset.v<=t)ui.draft.saveFrom=b.dataset.v;break;
    case 'savechip': if(ui.draft){ui.draft.save=+b.dataset.v;}break;
    case 'rnew': ui.rd={id:null,name:'',type:'weekly',habit:(active('good')[0]||{}).id||null,target:RTYPES.weekly.def,repeat:true};ui.err='';go('redit');render();var rn=$('#rname');if(rn)rn.focus();return;
    case 'redit': h=rById(id);if(!h)return;ui.rd={id:h.id,name:h.name,type:h.type,habit:h.habit,target:h.target,repeat:h.repeat};ui.err='';go('redit');break;
    case 'rtype': n=b.dataset.v;if(ui.rd.type!==n){var RT=RTYPES[n];ui.rd.type=n;ui.rd.target=RT.def;ui.rd.repeat=RT.rep;ui.rd.habit=RT.kind?((active(RT.kind)[0]||{}).id||null):null;}ui.err='';break;
    case 'rhabit': ui.rd.habit=id;ui.err='';break;
    case 'rstep': var RS=RTYPES[ui.rd.type],cur=Math.round(+ui.rd.target)||0,stp=RS.unit==='NT$'?(cur<1000||(cur===1000&&+b.dataset.n<0)?100:500):RS.step;ui.rd.target=Math.max(RS.min,Math.min(RS.max,cur+stp*(+b.dataset.n)));break;
    case 'rrep': ui.rd.repeat=b.dataset.v==='1';break;
    case 'rsave': saveReward();return;
    case 'rcancel': go('rewards');break;
    case 'rdelete': if(!ui.confirmDel){ui.confirmDel=true;break;}db.rewards=db.rewards.filter(function(r){return r.id!==ui.rd.id;});save();go('rewards');toast('已刪除獎勵');break;
    case 'redeem': h=rById(id);var tt=savingsTotals();if(!h||pending(h,tt)<1)return;
      var rx={id:uid(),rid:h.id,name:h.name,date:t,amount:h.type==='saved'?h.target:0};db.redeemed.push(rx);
      if(!h.repeat&&(h.type==='saved'||pending(h,savingsTotals())===0))h.done=true;
      save();ui.lastRedeem=rx.id;render();toast('已兌換，好好享受',5000,'<button class="toast-act" data-act="undoredeem">復原</button>');return;
    case 'undoredeem': if(ui.lastRedeem){removeRedemption(ui.lastRedeem);ui.lastRedeem=null;}$('#toast').hidden=true;break;
    case 'rdel': if(ui.confirmDel!==id){ui.confirmDel=id;break;}removeRedemption(id);ui.confirmDel=false;toast('已刪除這筆兌換紀錄');break;
    case 'export': doExport();return;
    case 'import': ui.sheet={type:'import',paste:''};break;
    case 'pickfile': $('#importFile').click();return;
    case 'usepaste': tryImport((ui.sheet&&ui.sheet.paste)||'');return;
    case 'confirmimport': db=ui.sheet.data;save();ui.sheet=null;ui.date=t;ui.follow=true;go('today');toast('已還原備份');break;
    case 'copy': copyText(ui.sheet.text);return;
    case 'download': downloadText(ui.sheet.text,ui.sheet.name);return;
    case 'closesheet': ui.sheet=null;break;
  }
  render();
}
document.addEventListener('click',function(e){
  if(e.target.id==='sheet'){ui.sheet=null;render();return;}
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b);
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='note'){var l=db.logs[ui.date]||(db.logs[ui.date]={});l.note=el.value;tidy(ui.date);save();}
  else if(el.id==='hname'&&ui.draft){ui.draft.name=el.value;
    if(!ui.draft.iconTouched){var g=guessIcon(el.value);if(g!==ui.draft.icon){ui.draft.icon=g;var ib=$('#icobtn');if(ib){ib.innerHTML=g?icoSvg(g,24):I.plus;ib.classList.toggle('empty',!g);ib.setAttribute('aria-label','選擇圖示，目前：'+(ICONS[g]?ICONS[g][0]:'沒有圖示'));}
      Array.prototype.forEach.call(document.querySelectorAll('.icogrid [data-act=seticon]'),function(x){x.setAttribute('aria-pressed',String(x.dataset.v===g));});}}}
  else if(el.id==='pastebox'&&ui.sheet){ui.sheet.paste=el.value;}
  else if(el.id==='rname'&&ui.rd){ui.rd.name=el.value;var rp=$('#rpreview');if(rp)rp.innerHTML=rPreview(ui.rd);}
  else if(el.id==='rtarget'&&ui.rd){ui.rd.target=parseInt(el.value.replace(/[^0-9]/g,''),10)||0;var rp2=$('#rpreview');if(rp2)rp2.innerHTML=rPreview(ui.rd);}
  else if(el.id==='hsavefrom'&&ui.draft){var tk=todayKey();if(isKey(el.value)){ui.draft.saveFrom=el.value>tk?tk:el.value;render();}}
  else if(el.id==='hsave'&&ui.draft){ui.draft.save=parseInt(el.value.replace(/[^0-9]/g,''),10)||0;Array.prototype.forEach.call(document.querySelectorAll('[data-act=savechip]'),function(c){c.classList.toggle('on',+c.dataset.v===ui.draft.save);});}
  else if(el.id==='q'){ui.q=el.value;var r=$('#results');if(r)r.innerHTML=searchResults();}
});
document.addEventListener('keydown',function(e){
  if(e.target.id==='hname'&&e.key==='Enter'){e.preventDefault();saveDraft();return;}
  if(ui.view==='search'&&e.key==='Escape'){act('sback',{dataset:{}});return;}
  if(ui.view==='pnl'&&!e.metaKey&&!e.ctrlKey){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();act('pkey',{dataset:{k:e.key}});}
    else if(e.key==='Backspace'){e.preventDefault();act('pkey',{dataset:{k:'del'}});}
    else if(e.key==='-'){e.preventDefault();act('psign',{dataset:{v:ui.pe.neg?'0':'1'}});}
    else if(e.key==='Enter'){e.preventDefault();act('psave',{dataset:{}});}
    else if(e.key==='Escape'){act('pcancel',{dataset:{}});}
  }
});
$('#importFile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){tryImport(String(r.result||''));};r.readAsText(f);e.target.value='';
});

/* drag to reorder in settings */
document.addEventListener('pointerdown',function(e){
  var hd=e.target.closest('[data-drag]');if(!hd)return;
  e.preventDefault();
  try{hd.releasePointerCapture(e.pointerId);}catch(err){}
  ui.dragId=hd.dataset.drag;render();
  function move(ev){
    var el=document.elementFromPoint(ev.clientX,ev.clientY),row=el&&el.closest('[data-row]');
    if(!row||row.dataset.row===ui.dragId)return;
    var a=byId(ui.dragId),b=byId(row.dataset.row);if(!a||!b||a.kind!==b.kind)return;
    var from=db.habits.indexOf(a),bi=db.habits.indexOf(b),down=from<bi;
    db.habits.splice(from,1);bi=db.habits.indexOf(b);db.habits.splice(down?bi+1:bi,0,a);
    render();
  }
  function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);ui.dragId=null;save();render();}
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
});

/* swipe left/right on 今天 to change day */
var sx=null,sy=0;
$('#main').addEventListener('touchstart',function(e){
  if(ui.view!=='today'||e.touches.length!==1||e.target.closest('textarea,input')){sx=null;return;}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;
},{passive:true});
$('#main').addEventListener('touchend',function(e){
  if(sx==null)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)<70||Math.abs(dy)>50)return;
  var k=addDays(ui.date,dx>0?-1:1),today=todayKey();if(k>today)return;
  ui.date=k;ui.follow=k===today;render();
},{passive:true});

/* a new day while the app sat in the background */
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;var t=todayKey();
  if(ui.follow&&ui.date!==t&&ui.view==='today'){ui.date=t;render();}
  else if(ui.follow)ui.date=t;
});

if('serviceWorker' in navigator&&document.documentElement.classList.contains('own-host')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
render();
if(autoIcons)toast('已幫 '+autoIcons+' 個習慣加上圖示，可在「習慣設定」修改',4000);
})();
</script>
