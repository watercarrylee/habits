name: closing prices
# Saves the whole Taiwan market's closing prices to prices.json after the close (no holdings involved).
on:
  schedule:
    - cron: '50 5 * * 1-5'   # 13:50 Taiwan time: the official sites may already have the day's closes
    - cron: '10 6 * * 1-5'   # 14:10 Taiwan time
    - cron: '40 6 * * 1-5'   # 14:40 Taiwan time
    - cron: '20 8 * * 1-5'   # 16:20 Taiwan time, in case the first run was early or delayed
    - cron: '30 9 * * 1-5'   # 17:30 Taiwan time: the open-data APIs can publish the day's closes late
    - cron: '5 12 * * 1-5'   # 20:05 Taiwan time, last try of the day
  workflow_dispatch:
permissions:
  contents: write
concurrency: prices
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned to a commit)
      - run: python3 tools/fetch_divs.py   # 除權除息預告表 → dividends.json (never blocks the prices)
        continue-on-error: true
      - run: python3 tools/fetch_prices.py
      - if: always()
        run: |
          if [ -n "$(git status --porcelain prices.json prices-30.json dividends.json)" ]; then
            git config user.name "prices bot"
            git config user.email "actions@users.noreply.github.com"
            git add prices.json prices-30.json dividends.json 2>/dev/null || git add prices.json prices-30.json
            git commit -m "prices: $(python3 -c 'import json;print(json.load(open("prices.json"))["d"])')"
            git push
          fi
