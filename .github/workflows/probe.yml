name: probe
on: { push: { branches: [probe-px2] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          set +e
          D=$(TZ=Asia/Taipei date +%Y%m%d); Y=$(TZ=Asia/Taipei date +%Y/%m/%d)
          {
          echo "== taipei $D"
          echo "== twse web"; curl -sS -m 40 -A 'Mozilla/5.0 (habits-prices)' "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=$D&type=ALLBUT0999&response=json" -o w.json -w 'http=%{http_code} size=%{size_download}\n'; head -c 300 w.json; echo
          echo "== tpex web"; curl -sS -m 40 -A 'Mozilla/5.0 (habits-prices)' "https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?date=$Y&type=EW&response=json" -o t.json -w 'http=%{http_code} size=%{size_download}\n'; head -c 300 t.json; echo
          echo "== twse api"; curl -sS -m 60 "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL" -o a.json -w 'http=%{http_code} size=%{size_download}\n'; head -c 200 a.json; echo
          echo "== tpex api"; curl -sS -m 60 "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes" -o b.json -w 'http=%{http_code} size=%{size_download}\n'; head -c 200 b.json; echo
          echo "== script"; python3 tools/fetch_prices.py; echo "exit=$?"; head -c 60 prices.json; echo
          } > probe.txt 2>&1
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe.txt; git commit -qm probe; git push -q origin HEAD:probe-px2
