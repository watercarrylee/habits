name: probe
on: { push: { branches: [probe-px2] } }
permissions: { contents: write, actions: read }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set +e
          { for r in 40315970769 40331301931 40378029512 39989261533; do echo "######## $r"; gh run view $r -R ${{ github.repository }} --log | grep -E "fetch_prices|TWSE|TPEx|wrote|unchanged|keeping|Error|error|prices.json|nothing|commit|push" | cut -c1-300 | head -40; done; } > probe2.txt 2>&1
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe2.txt; git commit -qm probe2; git push -q origin HEAD:probe-px2
