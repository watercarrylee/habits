name: probe sources
# temporary: saves trimmed samples of the official closing-quote pages to the probe branch so they can be inspected
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s && cd s
          D=$(TZ=Asia/Taipei date +%Y%m%d); Y=$(TZ=Asia/Taipei date +%Y); R=$((Y-1911)); MD=$(TZ=Asia/Taipei date +%m/%d)
          UA='Mozilla/5.0 (habits-prices)'
          for n in "old_ew|https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php?l=zh-tw&d=$R/$MD&se=EW&o=json" "old_al|https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php?l=zh-tw&d=$R/$MD&se=AL&o=json" "new_otc_ew|https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?date=$Y/$MD&type=EW&response=json" "new_otc|https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?date=$Y/$MD&response=json" "new_dq|https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQ?date=$Y/$MD&id=&response=json"; do
            k=${n%%|*}; u=${n#*|}
            curl -sS -m 180 -A "$UA" -w "$k %{http_code} %{size_download} %{time_total}\n" "$u" -o $k.json >> stats.txt 2>&1 || echo "$k curl-fail" >> stats.txt
          done
          ls -la
          python3 - <<'PY'
          import json,glob
          for f in glob.glob('*.json'):
              raw=open(f,'rb').read()
              try:
                  j=json.loads(raw.decode('utf-8-sig'))
              except Exception as e:
                  open(f+'.head','w').write(repr(raw[:3000])); continue
              def trim(o,d=0):
                  if isinstance(o,list): return [trim(x,d+1) for x in o[:6]]+(['...%d'%len(o)] if len(o)>6 else [])
                  if isinstance(o,dict): return {k:trim(v,d+1) for k,v in o.items()}
                  return o
              json.dump(trim(j),open(f+'.trim','w'),ensure_ascii=False,indent=1)
              # also keep rows for a few known codes
              hits=[]
              def walk(o):
                  if isinstance(o,list):
                      if o and isinstance(o[0],str) and o[0].strip() in ('2330','0050','6488','00679B','3037'): hits.append(o)
                      for x in o: walk(x)
                  elif isinstance(o,dict):
                      for v in o.values(): walk(v)
              walk(j); json.dump(hits,open(f+'.hits','w'),ensure_ascii=False,indent=1)
          PY
          rm -f *.json
          cat stats.txt
          git init -q -b probe && git add -A && git -c user.name=probe -c user.email=p@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
